<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>從 Storybook 到上線</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0F141A;
    --surface: #18202A;
    --surface-2: #222D3A;
    --surface-3: #2E3B4A;
    --ink: #E9EEF4;
    --muted: #9AAABB;
    --faint: #6B7B8C;
    --coral: #FF8A93;
    --coral-deep: #3A2328;
    --teal: #55DCC9;
    --teal-deep: #17332F;
    --amber: #FFB95E;
    --amber-deep: #3A2E1A;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    --topbar: 56px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-padding-top: calc(var(--topbar) + 12px); }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  h1 { font-size: 38px; font-weight: 900; line-height: 1.25; text-wrap: balance; letter-spacing: 0.01em; }
  h2 { font-size: 26px; font-weight: 900; line-height: 1.3; text-wrap: balance; margin-bottom: 8px; }
  h3 { font-size: 18px; font-weight: 700; line-height: 1.4; }
  p  { max-width: 68ch; }
  .lede { font-size: 17.5px; color: var(--muted); max-width: 62ch; }
  .eyebrow {
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint);
    display: block; margin-bottom: 10px;
  }
  .eyebrow.coral { color: var(--coral); }
  .eyebrow.teal  { color: var(--teal); }
  .eyebrow.amber { color: var(--amber); }
  code {
    font-family: var(--mono); font-size: 0.88em;
    background: var(--surface-2); color: var(--ink);
    padding: 2px 7px; border-radius: 5px; white-space: nowrap;
  }
  section { margin-top: 64px; }
  section:first-child { margin-top: 0; }
  .section-intro { color: var(--muted); margin-top: 6px; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  .topbar a:focus-visible, .station-tab:focus-visible { outline-offset: -2px; }
  a { color: var(--teal); }

  /* ---------- app shell ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    height: var(--topbar);
    display: flex; align-items: center; gap: 18px;
    padding: 0 22px;
    background: var(--bg);
    border-bottom: 1px solid var(--surface-2);
  }
  .brand {
    display: flex; align-items: center; gap: 9px;
    color: var(--ink); text-decoration: none; flex: none;
    font-weight: 900; font-size: 14px; letter-spacing: 0.02em;
  }
  .brand-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--coral); flex: none; }
  .tabs { display: flex; align-items: center; gap: 2px; overflow-x: auto; min-width: 0; }
  .tabs a {
    padding: 7px 13px; border-radius: 9px;
    color: var(--muted); text-decoration: none;
    font-size: 14px; font-weight: 700; white-space: nowrap;
    transition: background 0.15s, color 0.15s;
  }
  .tabs a:hover { background: var(--surface); color: var(--ink); }
  .tabs a.active { background: var(--ink); color: var(--bg); }
  .wrap { max-width: 880px; margin: 0 auto; padding: 44px 24px 96px; }
  .view-enter { animation: view-in 0.35s ease-out; }
  @keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ---------- hero ---------- */
  .hero-tag {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    letter-spacing: 0.16em; color: var(--bg); background: var(--ink);
    padding: 4px 12px; border-radius: 100px; margin-bottom: 20px;
  }
  .hero p { margin-top: 16px; }
  .route-pills { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
  .route-pill {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: none; color: var(--ink); text-align: left;
    border-radius: 12px; padding: 14px 18px;
    font-weight: 700; font-size: 15px; font-family: inherit; line-height: 1.6;
    text-decoration: none; transition: background 0.15s;
  }
  .route-pill:hover { background: var(--surface-2); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot.coral { background: var(--coral); }
  .dot.teal  { background: var(--teal); }
  .route-pill small { display: block; font-weight: 400; font-size: 13px; color: var(--muted); }

  /* ---------- wizard ---------- */
  .wizard { background: var(--surface); border-radius: 18px; padding: 30px; margin-top: 26px; }
  .wz-q { margin-top: 22px; }
  .wz-q:first-child { margin-top: 0; }
  .wz-label { font-weight: 700; font-size: 15.5px; margin-bottom: 10px; display: block; }
  .wz-label .wz-step {
    font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--faint); margin-right: 8px;
  }
  .wz-opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .wz-opt {
    border: none; background: var(--surface-2); color: var(--ink);
    border-radius: 10px; padding: 10px 16px; font-size: 14.5px; line-height: 1.5;
    transition: background 0.15s;
  }
  .wz-opt:hover { background: var(--surface-3); }
  .wz-opt[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
  .wz-result { margin-top: 26px; background: var(--bg); border-radius: 14px; padding: 24px; }
  .wz-empty { color: var(--faint); font-size: 14.5px; }
  .wz-route-badge {
    display: inline-block; font-family: var(--mono); font-size: 12.5px; font-weight: 600;
    letter-spacing: 0.08em; border-radius: 100px; padding: 3px 12px; margin-bottom: 12px;
  }
  .wz-route-badge.a { background: var(--coral-deep); color: var(--coral); }
  .wz-route-badge.b { background: var(--teal-deep); color: var(--teal); }
  .wz-result h3 { font-size: 19px; margin-bottom: 6px; }
  .wz-result .wz-why { color: var(--muted); font-size: 14.5px; max-width: none; }
  .wz-steps { list-style: none; margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
  .wz-steps li { display: flex; gap: 10px; font-size: 14.5px; align-items: baseline; }
  .wz-steps .n { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--faint); flex: none; }
  .wz-note { margin-top: 16px; font-size: 13.5px; color: var(--amber); background: var(--amber-deep); border-radius: 10px; padding: 10px 14px; max-width: none; }
  .wz-note b { font-weight: 700; }
  .wz-jump { margin-top: 16px; display: inline-block; background: var(--surface-2); color: var(--ink); border: none; border-radius: 10px; padding: 9px 16px; font-size: 14px; font-weight: 700; text-decoration: none; }
  .wz-jump:hover { background: var(--surface-3); }
  .paste-hint { margin-top: 22px; font-size: 14px; color: var(--muted); background: var(--surface); border-radius: 12px; padding: 14px 18px; max-width: none; }
  .paste-hint b { color: var(--ink); }

  /* ---------- say / copy ---------- */
  .say {
    display: flex; align-items: flex-start; gap: 12px;
    font-family: var(--mono); font-size: 13px; line-height: 1.7;
    background: var(--bg); color: var(--ink); border-radius: 8px;
    padding: 10px 14px; margin-top: 10px;
  }
  .wz-result .say, .panel .say { background: var(--surface); }
  .say .say-text { flex: 1; }
  .say .say-text::before { content: "你這樣說 › "; color: var(--faint); font-weight: 600; }
  .copy-btn {
    border: none; background: var(--surface-2); color: var(--muted);
    font-family: var(--mono); font-size: 12px; font-weight: 600;
    border-radius: 7px; padding: 5px 11px; flex: none; margin-top: 2px;
    transition: background 0.15s;
  }
  .copy-btn:hover { background: var(--surface-3); color: var(--ink); }
  .copy-btn.copied { background: var(--teal-deep); color: var(--teal); }

  /* ---------- pipeline strip ---------- */
  .pipeline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 26px; }
  .pipe-node {
    background: var(--surface-2); border-radius: 8px; padding: 8px 13px;
    font-size: 13px; font-weight: 500; line-height: 1.5; text-align: center;
  }
  .pipe-node b { display: block; font-size: 13.5px; font-weight: 700; }
  .pipe-node span { color: var(--muted); font-size: 12px; }
  .pipe-arrow { color: var(--faint); font-family: var(--mono); font-size: 14px; }

  /* ---------- journey tabs ---------- */
  .stations { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
  .station-tab {
    border: none; background: var(--surface); color: var(--muted);
    border-radius: 10px; padding: 10px 15px; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; gap: 8px; transition: background 0.15s;
  }
  .station-tab .sn { font-family: var(--mono); font-size: 12.5px; font-weight: 600; color: var(--faint); }
  .station-tab:hover { background: var(--surface-2); color: var(--ink); }
  .station-tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .station-tab[aria-pressed="true"] .sn { color: var(--bg); }
  .panel { background: var(--surface); border-radius: 16px; padding: 26px; margin-top: 14px; }
  .panel-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .panel-head .pn { font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--faint); }
  .panel-head h3 { font-size: 21px; font-weight: 900; }
  .gate-mark {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    color: var(--amber); background: var(--amber-deep);
    padding: 2px 9px; border-radius: 100px;
  }
  .lanes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 18px; }
  .lane { background: var(--surface-2); border-radius: 12px; padding: 16px; font-size: 14px; line-height: 1.65; }
  .lane .lane-t {
    font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--faint); display: block; margin-bottom: 8px;
  }
  .lane.you { background: var(--surface-3); }
  @media (max-width: 680px) { .lanes { grid-template-columns: 1fr; } }
  .panel-nav { display: flex; justify-content: space-between; margin-top: 18px; }
  .panel-nav button {
    border: none; background: var(--surface-2); color: var(--muted);
    border-radius: 8px; padding: 8px 14px; font-size: 13.5px; font-weight: 700;
  }
  .panel-nav button:hover:not(:disabled) { background: var(--surface-3); color: var(--ink); }
  .panel-nav button:disabled { opacity: 0.35; cursor: default; }

  /* ---------- flow steps ---------- */
  .flow-card { background: var(--surface); border-radius: 16px; padding: 30px 30px 26px; margin-top: 26px; }
  .flow-card > p { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .fit { font-size: 14px; margin-top: 14px; padding: 12px 16px; border-radius: 10px; background: var(--surface-2); max-width: none; }
  .fit b { font-weight: 700; }
  .steps { list-style: none; margin-top: 22px; display: flex; flex-direction: column; gap: 18px; }
  .step { display: grid; grid-template-columns: 40px 1fr; gap: 16px; }
  .step-num {
    width: 40px; height: 40px; border-radius: 10px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 16px; font-weight: 600;
  }
  .flow-a .step-num { background: var(--coral-deep); color: var(--coral); }
  .flow-b .step-num { background: var(--teal-deep); color: var(--teal); }
  .step h3 { margin-bottom: 3px; }
  .step p { font-size: 14.5px; color: var(--muted); max-width: none; }

  /* ---------- gates ---------- */
  .gates { display: flex; flex-direction: column; gap: 12px; margin-top: 26px; }
  .gate { background: var(--surface); border-radius: 14px; padding: 22px; }
  .gate h3 { color: var(--amber); font-size: 16px; margin-bottom: 6px; }
  .gate > p { font-size: 14px; color: var(--muted); max-width: none; }
  .g-label {
    display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    color: var(--amber); background: var(--amber-deep); border-radius: 100px;
    padding: 2px 10px; margin-bottom: 12px;
  }
  .gate details { margin-top: 14px; }
  .gate summary {
    list-style: none; display: inline-block; cursor: pointer;
    background: var(--surface-2); color: var(--ink); border-radius: 9px;
    padding: 8px 15px; font-size: 13.5px; font-weight: 700;
  }
  .gate summary::-webkit-details-marker { display: none; }
  .gate summary:hover { background: var(--surface-3); }
  .gate details[open] summary { background: var(--amber-deep); color: var(--amber); }
  .dialog { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; border-radius: 12px; padding: 12px 16px; font-size: 13.5px; line-height: 1.7; }
  .msg.ai { background: var(--surface-2); align-self: flex-start; }
  .msg.ai::before {
    content: "AI"; display: block; font-family: var(--mono); font-size: 12px;
    font-weight: 600; letter-spacing: 0.1em; color: var(--faint); margin-bottom: 4px;
  }
  .msg.reply-set { align-self: flex-end; background: none; padding: 0; max-width: 100%; text-align: right; }
  .msg.reply-set .rl {
    display: block; font-family: var(--mono); font-size: 12px; font-weight: 600;
    letter-spacing: 0.1em; color: var(--faint); margin-bottom: 6px;
  }
  .reply-chip {
    display: inline-block; background: var(--surface-3); color: var(--ink);
    border-radius: 100px; padding: 6px 15px; font-size: 13px; margin: 3px 0 0 6px;
  }

  /* ---------- choose rule ---------- */
  .rule { margin-top: 26px; background: var(--surface); border-radius: 12px; padding: 16px 20px; font-size: 15px; max-width: none; }
  .rule b { font-weight: 900; }

  /* ---------- glossary ---------- */
  .glossary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 26px; }
  .term { background: var(--surface); border-radius: 12px; padding: 18px 20px; }
  .term dt { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .term dd { font-size: 13.5px; color: var(--muted); }
  @media (max-width: 640px) { .glossary { grid-template-columns: 1fr; } }

  /* ---------- next / footer ---------- */
  .next-links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .next-link {
    background: var(--surface); color: var(--ink); text-decoration: none;
    border-radius: 12px; padding: 13px 18px; font-size: 14px; font-weight: 700;
    transition: background 0.15s;
  }
  .next-link:hover { background: var(--surface-2); }
  .next-link small { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted); }
  .endnote { margin-top: 72px; color: var(--faint); font-size: 13px; font-family: var(--mono); letter-spacing: 0.04em; line-height: 2; }
  .endnote a { color: var(--teal); text-decoration: none; }
  .endnote a:hover { text-decoration: underline; text-underline-offset: 3px; }

  @media (max-width: 700px) {
    .wrap { padding: 30px 16px 72px; }
    .topbar { padding: 0 12px; gap: 10px; }
    .tabs { gap: 0; }
    .tabs a { padding: 6px 9px; font-size: 13px; }
    .brand span:not(.brand-dot) { display: none; }
    h1 { font-size: 29px; }
    h2 { font-size: 22px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/"><span class="brand-dot"></span><span>從 Storybook 到上線</span></a>
  <nav class="tabs" id="tabs" aria-label="主導覽">
    <a href="#/" data-tab="start">找路線</a>
    <a href="#/journey" data-tab="journey">六站旅程</a>
    <a href="#/route-a" data-tab="route-a">路線 A</a>
    <a href="#/route-b" data-tab="route-b">路線 B</a>
    <a href="#/gates" data-tab="gates">紅綠燈</a>
    <a href="#/glossary" data-tab="glossary">名詞小抄</a>
  </nav>
</header>

<main class="wrap" id="view"></main>

<script>
  "use strict";

  /* =====================================================  shared content */

  const esc = (v) =>
    String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  /* label 顯示在句子前（不會被複製）；text 是實際複製的內容 */
  const say = (text, label) =>
    `<div class="say"><span class="say-text">${label ? `（${esc(label)}）` : ""}${esc(text)}</span><button class="copy-btn" type="button" data-copy="${esc(text)}">複製</button></div>`;

  const footer = `
    <p class="endnote">
      cm-skills · designer guide · 路線 A：storybook-product-prototype → frontend-product-implementation · 路線 B：元件庫 → frontend-product-implementation<br>
      更多旅程與工具：<a href="skills-guide.html">CM Skills 使用指南</a>
    </p>`;

  /* ================================================================ 找路線 */

  const wizardState = { have: null, scale: null, prod: null };

  const wizardQuestions = [
    {
      id: "have", step: "Q1", label: "你手上現在有什麼？",
      opts: [
        { v: "proto", label: "已審查的 Storybook 原型" },
        { v: "mockup", label: "定案的設計稿（Figma／截圖）" },
        { v: "idea", label: "還只是需求或想法" },
      ],
    },
    {
      id: "scale", step: "Q2", label: "這次要做的規模？",
      opts: [
        { v: "feature", label: "完整功能（多畫面、有流程）" },
        { v: "screen", label: "單一畫面或小改版" },
      ],
    },
    {
      id: "prod", step: "Q3", label: "正式產品那邊的現況？",
      opts: [
        { v: "healthy", label: "有元件庫也有 tokens" },
        { v: "partial", label: "不完整，或我不確定" },
        { v: "none", label: "全新產品，什麼都還沒有" },
      ],
    },
  ];

  const wizardResults = {
    "proto|feature": {
      route: "a", badge: "ROUTE A", title: "路線 A：帶著交接文件進產品",
      why: "原型和文件都齊了，這是最順的一條路——交接包就是 AI 的施工圖。",
      steps: ["打開交接文件 PRODUCTION_HANDOFF，確認目標頁面寫對", "到產品專案，用下面這句話開工", "AI 盤點後動工，缺什麼會先問你", "完成後用 ui-compare-to-reference 驗收"],
      say: "請用 frontend-product-implementation，依原型的 handoff 文件把這個功能實作進產品。",
      jump: "#/route-a", jumpText: "看路線 A 完整步驟 →",
    },
    "proto|screen": {
      route: "a", badge: "ROUTE A・輕量", title: "路線 A（輕量版）：小東西也走交接文件",
      why: "既然原型和文件都有了，照走 A 但份量小——AI 只會動需要的那個畫面。",
      steps: ["跟 AI 確認交接文件（handoff）裡這個畫面的範圍", "到產品專案，用下面這句話開工", "完成後用 ui-compare-to-reference 驗收"],
      say: "請用 frontend-product-implementation，依 handoff 文件實作〇〇這個畫面就好，其他不動。",
      jump: "#/route-a", jumpText: "看路線 A 完整步驟 →",
    },
    "mockup|feature": {
      route: "a", badge: "ROUTE A・從原型站進入", title: "建議先補原型，再走路線 A",
      why: "多畫面的功能直接進產品風險高——先花一點時間把設計稿變成可點擊原型和交接文件，流程和狀態先驗證過，之後的實作幾乎不會返工。",
      steps: ["用下面這句話，把設計稿變成原型＋文件", "在 Storybook 點過每條流程，確認無誤", "接著照路線 A 的步驟 1–5 走"],
      say: "請用 storybook-product-prototype，把這組設計稿變成可點擊原型和交接文件。",
      jump: "#/route-a", jumpText: "之後進產品時：路線 A 完整步驟 →",
    },
    "mockup|screen": {
      route: "b", badge: "ROUTE B", title: "路線 B：讓 AI 認積木，直接組裝",
      why: "單一畫面、設計稿已定案——不用原型，直接請 AI 盤點畫面上的元件、對應元件庫、拼進產品。",
      steps: ["把設計稿（Figma 連結或截圖）給 AI", "用下面這句話開工", "AI 盤點元件庫後組裝，缺積木會先問你", "完成後用 ui-pixel-align-report 出比對報告"],
      say: "請用 ui-screenshot-to-storybook-product，用我們的元件庫實作這張設計稿。",

        <p class="rule"><b>小提示：</b>如果你的 Storybook 裝了「元件覆蓋率分析」工具頁（Tools › Component Coverage Analyzer），可以改在那個頁面送出設計稿，按「複製分析提示詞」貼給 AI——分析報告會把畫面分成三類（可直接用現成元件、需擴充、缺少需新建）。你在頁面上逐區塊覆核、按「確認覆核完成」後，再按「複製實作提示詞」交給 AI 實作。這條路取代步驟 2 和 3；驗收仍照步驟 4 走。</p>
        <p class="rule"><b>一句話判斷：</b>需要「說服別人或驗證想法」→ 路線 A；只是「把定案的東西做出來」→ 路線 B。中途發現 B 越做越大，隨時可以回頭補原型和文件，兩條路不衝突。</p>
        <div class="next-links">
          <a class="next-link" href="#/gates">下一步：先看紅綠燈<small>AI 何時會停下來等你點頭</small></a>
          <a class="next-link" href="#/route-a">改走路線 A<small>完整功能帶交接文件</small></a>
        </div>
      </section>`;
  }

  /* ================================================================ 紅綠燈 */

  function renderGates() {
    return `
      <section>
        <span class="eyebrow amber">Approval Gates</span>
        <h2>紅綠燈：AI 什麼時候會停下來等你</h2>
        <p class="section-intro">不管走哪條路線，遇到下面這幾種情況——三個紅綠燈，加一個最壞情況的備案——AI 都會停下來問你，不會自作主張。展開「看模擬對話」，先預覽 AI 會怎麼問、你可以怎麼回——實際遇到時就不會慌。</p>
        <div class="gates">
          <div class="gate">
            <span class="g-label">GATE 1</span>
            <h3>產品裡沒有 design tokens</h3>
            <p>AI 會啟動「token 搬運計畫」：從你的 Storybook 元件庫找出這次<em>實際用到</em>的顏色、字級、間距，列成一張最小清單給你看，並依產品的技術選好落地格式。你點頭，它才建立。不會整包硬搬，也不會偷偷寫死數值。</p>
            <details>
              <summary>看模擬對話</summary>
              <div class="dialog">
                <div class="msg ai">這個產品專案裡找不到 design token 系統。我建議建立一組最小 token——這次畫面實際用到的 9 個（sys-color-primary、sys-spacing-md⋯⋯每個都對應到你 Storybook 元件庫的來源檔案）。落地格式建議用 CSS variables，因為這個產品是純 CSS。要建立嗎？</div>
                <div class="msg reply-set"><span class="rl">你可以這樣回</span><span class="reply-chip">可以，照清單建立</span><span class="reply-chip">先列出這 9 個給我看</span><span class="reply-chip">等等，我找工程師確認格式</span></div>
              </div>
            </details>
          </div>
          <div class="gate">
            <span class="g-label">GATE 2</span>
            <h3>現成元件拼不出這個畫面</h3>
            <p>AI 會告訴你缺哪塊積木，問你要不要先做一個新的共用元件。你同意後它才建；專案有 Storybook 時會同步補上元件文件（stories），新積木從此進元件庫，下次直接用。</p>
            <details>
              <summary>看模擬對話</summary>
              <div class="dialog">
                <div class="msg ai">這張畫面需要一個「可搜尋的下拉選單」，但元件庫目前只有基本的 Select。兩個選項：（1）建立新的共用元件 SearchableSelect，會一併補上 Storybook 文件；（2）先用現有 Select 頂著，搜尋功能之後再加。你想走哪個？</div>
                <div class="msg reply-set"><span class="rl">你可以這樣回</span><span class="reply-chip">建立新元件</span><span class="reply-chip">先用現有 Select</span><span class="reply-chip">給我看兩種的畫面差異</span></div>
              </div>
            </details>
          </div>
          <div class="gate">
            <span class="g-label">GATE 3</span>
            <h3>產品的樣式寫法不只一種</h3>
            <p>老專案常常混用多種樣式技術。AI 分不出哪個是主流時，會列出選項問你（或問工程師）要走哪一套，確定了才動工，避免把新畫面蓋在錯的地基上。對話裡的技術名詞看不懂沒關係——這一題本來就可以整包轉給工程師決定。</p>
            <details>
              <summary>看模擬對話</summary>
              <div class="dialog">
                <div class="msg ai">這個專案同時存在 SCSS variables 和 CSS custom properties 兩套寫法，各佔約一半，判斷不出主流。新建立的 tokens 要走哪一套？</div>
                <div class="msg reply-set"><span class="rl">你可以這樣回</span><span class="reply-chip">我問一下工程師再回你</span><span class="reply-chip">先列出兩套各用在哪些地方</span></div>
              </div>
            </details>
          </div>
          <div class="gate">
            <span class="g-label">BACKUP</span>
            <h3>連 Storybook 端都沒有 tokens？</h3>
            <p>最壞情況也有備案：AI 會從交接文件的 UI 規格和原型樣式「逆向整理」出一份候選 token 表——每個值都附出處——先交給你核准，才開始建。永遠不會發生「沒有 tokens 所以先寫死」這件事。</p>
            <details>
              <summary>看模擬對話</summary>
              <div class="dialog">
                <div class="msg ai">原型端找不到 token 來源，我從 UI 規格和原型樣式逆向整理出候選清單：顏色 6 個、間距 4 個、字級 3 個、圓角 2 個，每個值都標了出處。清單如下⋯⋯確認後我才會建立 token 檔案。</div>
                <div class="msg reply-set"><span class="rl">你可以這樣回</span><span class="reply-chip">確認，照這份建立</span><span class="reply-chip">主色不對，應該是 #2A6BFF</span><span class="reply-chip">間距先保留，其他建立</span></div>
              </div>
            </details>
          </div>
        </div>
        <div class="next-links">
          <a class="next-link" href="#/route-a">回路線 A 繼續<small>原型 → 產品</small></a>
          <a class="next-link" href="#/route-b">回路線 B 繼續<small>元件庫 → 直接組裝</small></a>
        </div>
      </section>`;
  }

  /* =============================================================== 名詞小抄 */

  function renderGlossary() {
    return `
      <section>
        <span class="eyebrow">Cheat Sheet</span>
        <h2>名詞小抄</h2>
        <p class="section-intro">流程中會出現的詞，用設計師的語言翻譯一次。</p>
        <dl class="glossary">
          <div class="term">
            <dt>PRD（產品需求文件）</dt>
            <dd>把「要做什麼、為誰做、做到什麼程度算成功」寫清楚的一份文件。從想法開始走路線 A 時，AI 會用問答陪你把它生出來，不用自己從空白頁寫。</dd>
          </div>
          <div class="term">
            <dt>Design Token</dt>
            <dd>設計決策的最小單位：一個顏色、一個字級、一個間距，都有名字。改一個 token，全產品跟著改——這就是為什麼絕不寫死數值。</dd>
          </div>
          <div class="term">
            <dt>元件庫（Component Library）</dt>
            <dd>Storybook 裡那些有文件、可重用的積木：按鈕、輸入框、卡片。產品畫面應該用積木拼，而不是每頁重畫。</dd>
          </div>
          <div class="term">
            <dt>Handoff（交接文件）</dt>
            <dd>原型階段產出的七份文件，讓接手的人不用私訊問你「這裡是什麼意思」。核心是 <code>PRODUCTION_HANDOFF.md</code>。</dd>
          </div>
          <div class="term">
            <dt>UI Flow</dt>
            <dd>畫面與畫面之間怎麼跳轉的地圖：從哪裡點什麼、到哪裡去，包含錯誤和載入這些中途狀態。</dd>
          </div>
          <div class="term">
            <dt>Fixture（假資料）</dt>
            <dd>寫死的示範資料，讓畫面在真實 API 接上之前就能完整展示。工程師之後把它換成真資料，畫面不用重做。</dd>
          </div>
          <div class="term">
            <dt>ref → sys → comp</dt>
            <dd>token 的三層命名：ref 是原料（藍色 500），sys 是語意（主色），comp 是元件用途（按鈕底色）。搬運 tokens 時這個層級會被完整保留。</dd>
          </div>
        </dl>
      </section>`;
  }

  /* ================================================================ router */

  const viewEl = document.getElementById("view");
  let navByClick = false;

  const views = {
    "start": { render: renderStart, title: "從 Storybook 到上線" },
    "journey": { render: renderJourney, title: "六站旅程 — 從 Storybook 到上線" },
    "route-a": { render: renderRouteA, title: "路線 A — 從 Storybook 到上線" },
    "route-b": { render: renderRouteB, title: "路線 B — 從 Storybook 到上線" },
    "gates": { render: renderGates, title: "紅綠燈 — 從 Storybook 到上線" },
    "glossary": { render: renderGlossary, title: "名詞小抄 — 從 Storybook 到上線" },
  };

  function route() {
    const hash = location.hash || "#/";
    const id = hash === "#/" ? "start" : hash.replace(/^#\//, "");
    const view = views[id] || views["start"];
    const tabId = views[id] ? id : "start";
    viewEl.innerHTML = `<div class="view-enter">${view.render()}${footer}</div>`;
    document.title = view.title;
    document.querySelectorAll("#tabs a").forEach((a) => {
      a.classList.toggle("active", a.dataset.tab === tabId);
    });
    if (navByClick) window.scrollTo(0, 0);
    navByClick = false;
  }

  window.addEventListener("hashchange", route);
  route();

  /* ========================================================== interactions */

  document.addEventListener("click", async (event) => {
    const navLink = event.target.closest('a[href^="#"]');
    if (navLink && navLink.getAttribute("href") !== (location.hash || "#/")) navByClick = true;

    /* copy buttons */
    const copyBtn = event.target.closest("[data-copy]");
    if (copyBtn) {
      let copied = true;
      try {
        await navigator.clipboard.writeText(copyBtn.dataset.copy);
      } catch {
        const area = document.createElement("textarea");
        area.value = copyBtn.dataset.copy;
        area.setAttribute("readonly", "");
        area.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
        document.body.appendChild(area);
        area.select();
        copied = document.execCommand("copy");
        area.remove();
      }
      if (copied) {
        copyBtn.classList.add("copied");
        copyBtn.textContent = "已複製 ✓";
        setTimeout(() => {
          copyBtn.classList.remove("copied");
          copyBtn.textContent = "複製";
        }, 1600);
      }
      return;
    }

    /* wizard options */
    const wzBtn = event.target.closest(".wz-opts [data-v]");
    if (wzBtn) {
      const group = wzBtn.closest(".wz-opts");
      const q = group.dataset.q;
      const v = wzBtn.dataset.v;
      wizardState[q] = wizardState[q] === v ? null : v;
      group.querySelectorAll("[data-v]").forEach((b) => {
        b.setAttribute("aria-pressed", String(b === wzBtn && wizardState[q] === v));
      });
      const out = document.getElementById("wz-result");
      if (out) out.innerHTML = renderWizardResult();
      return;
    }

    /* station tabs + prev/next */
    const stTab = event.target.closest("[data-st]");
    if (stTab) {
      currentStation = parseInt(stTab.dataset.st, 10);
      document.querySelectorAll("[data-st]").forEach((t) => {
        t.setAttribute("aria-pressed", String(parseInt(t.dataset.st, 10) === currentStation));
      });
      const panel = document.getElementById("station-panel");
      if (panel) panel.innerHTML = renderStationPanel();
      return;
    }
    let moved;
    if (event.target.closest("#pn-prev") && currentStation > 0) {
      currentStation -= 1;
      moved = "pn-prev";
    } else if (event.target.closest("#pn-next") && currentStation < stations.length - 1) {
      currentStation += 1;
      moved = "pn-next";
    } else {
      return;
    }
    document.querySelectorAll("[data-st]").forEach((t) => {
      t.setAttribute("aria-pressed", String(parseInt(t.dataset.st, 10) === currentStation));
    });
    const panel = document.getElementById("station-panel");
    if (panel) panel.innerHTML = renderStationPanel();
    const btn = document.getElementById(moved);
    if (btn && !btn.disabled) btn.focus();
    else {
      const other = document.getElementById(moved === "pn-prev" ? "pn-next" : "pn-prev");
      if (other) other.focus();
    }
  });
</script>
