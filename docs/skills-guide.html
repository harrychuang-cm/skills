<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CM Skills Guide</title>
    <style>
      :root {
        --color-page: #f6f7f9;
        --color-surface: #ffffff;
        --color-surface-soft: #eef3f5;
        --color-surface-strong: #17211f;
        --color-text: #17211f;
        --color-muted: #5d6a67;
        --color-line: #d9e0df;
        --color-line-strong: #bbc8c5;
        --color-accent: #0f766e;
        --color-accent-strong: #064e49;
        --color-accent-soft: #d9f0ed;
        --color-indigo: #4338ca;
        --color-indigo-soft: #e5e7ff;
        --color-rose: #be3455;
        --color-rose-soft: #fde3ea;
        --color-amber: #a15c08;
        --color-amber-soft: #faecd1;
        --color-code: #111c1a;
        --color-code-text: #effaf7;
        --color-code-muted: #d5e3df;
        --color-code-overlay-line: rgba(239, 250, 247, 0.18);
        --color-code-overlay-soft: rgba(239, 250, 247, 0.08);
        --color-notice-line: #efc56f;
        --color-topbar-line: rgba(217, 224, 223, 0.86);
        --color-topbar-surface: rgba(246, 247, 249, 0.94);
        --shadow-card: 0 12px 30px rgba(23, 33, 31, 0.08);
        --shadow-hero: 0 24px 60px rgba(23, 33, 31, 0.13);
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 20px;
        --space-6: 24px;
        --space-7: 32px;
        --space-8: 40px;
        --radius-card: 8px;
        --radius-control: 8px;
        --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-code: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--color-page);
        color: var(--color-text);
        font-family: var(--font-body);
        line-height: 1.62;
      }

      a {
        color: var(--color-accent-strong);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      button:focus-visible,
      a:focus-visible {
        outline: 3px solid var(--color-indigo);
        outline-offset: 3px;
      }

      code {
        border: 1px solid var(--color-line);
        border-radius: 6px;
        padding: 1px 5px;
        background: var(--color-surface-soft);
        color: var(--color-accent-strong);
        font-family: var(--font-code);
        font-size: 0.9em;
      }

      .page {
        max-width: 1220px;
        margin: 0 auto;
        padding: var(--space-4) var(--space-6) 72px;
      }

      .topbar {
        position: sticky;
        z-index: 10;
        top: 0;
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: var(--space-4);
        align-items: center;
        margin: 0 calc(var(--space-6) * -1) var(--space-5);
        padding: var(--space-3) var(--space-6);
        border-bottom: 1px solid var(--color-topbar-line);
        background: var(--color-topbar-surface);
        backdrop-filter: blur(16px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
        color: var(--color-text);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
        white-space: nowrap;
      }

      .brand-mark {
        display: inline-grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 8px;
        background: var(--color-surface-strong);
        color: var(--color-code-text);
        font-size: 12px;
      }

      .section-nav {
        display: flex;
        gap: var(--space-1);
        justify-content: center;
        overflow-x: auto;
        scrollbar-width: none;
      }

      .section-nav::-webkit-scrollbar {
        display: none;
      }

      .section-nav a {
        border-radius: var(--radius-control);
        padding: 8px 10px;
        color: var(--color-muted);
        font-size: 13px;
        font-weight: 750;
        text-decoration: none;
        white-space: nowrap;
      }

      .section-nav a:hover {
        background: var(--color-accent-soft);
        color: var(--color-accent-strong);
      }

      .language-switcher {
        display: inline-flex;
        gap: var(--space-1);
        padding: var(--space-1);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-control);
        background: var(--color-surface);
        box-shadow: var(--shadow-card);
      }

      .language-switcher button {
        min-width: 50px;
        border: 0;
        border-radius: 6px;
        padding: 7px 10px;
        background: transparent;
        color: var(--color-muted);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 800;
      }

      .language-switcher button:hover {
        background: var(--color-surface-soft);
        color: var(--color-text);
      }

      .language-switcher button[aria-pressed="true"] {
        background: var(--color-accent);
        color: var(--color-surface);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr);
        gap: var(--space-7);
        align-items: stretch;
        padding: var(--space-8);
        border: 1px solid var(--color-line);
        border-radius: var(--radius-card);
        background: var(--color-surface);
        box-shadow: var(--shadow-hero);
      }

      .hero-copy {
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .hero-card {
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
        padding: var(--space-6);
        border: 1px solid var(--color-line-strong);
        border-radius: var(--radius-card);
        background: var(--color-surface-strong);
        color: var(--color-code-text);
      }

      .hero-card p,
      .hero-card li {
        color: var(--color-code-muted);
      }

      .hero-card code {
        border-color: var(--color-code-overlay-line);
        background: var(--color-code-overlay-soft);
        color: var(--color-code-text);
      }

      .eyebrow,
      .card-label {
        margin: 0;
        color: var(--color-accent);
        font-size: 13px;
        font-weight: 850;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      .card-label {
        color: var(--color-amber-soft);
      }

      h1,
      h2,
      h3 {
        margin: 0;
        line-height: 1.18;
        letter-spacing: 0;
      }

      h1 {
        max-width: 820px;
        margin-top: var(--space-2);
        font-size: 58px;
      }

      h2 {
        font-size: 30px;
      }

      h3 {
        font-size: 19px;
      }

      p {
        margin: 0;
      }

      .lead {
        max-width: 780px;
        margin-top: var(--space-5);
        color: var(--color-muted);
        font-size: 18px;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        margin-top: var(--space-6);
      }

      .pill {
        border: 1px solid var(--color-line);
        border-radius: 999px;
        padding: 7px 11px;
        background: var(--color-surface-soft);
        color: var(--color-text);
        font-size: 13px;
        font-weight: 750;
      }

      .section {
        scroll-margin-top: 96px;
        padding: 46px 0 0;
      }

      .section-header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: var(--space-5);
        margin-bottom: var(--space-5);
      }

      .section-header::after {
        display: block;
        flex: 1;
        min-width: 80px;
        height: 1px;
        background: var(--color-line);
        content: "";
      }

      .grid {
        display: grid;
        gap: var(--space-4);
      }

      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .panel,
      .skill,
      .step,
      .prompt {
        border: 1px solid var(--color-line);
        border-radius: var(--radius-card);
        background: var(--color-surface);
        box-shadow: var(--shadow-card);
      }

      .panel {
        display: flex;
        flex-direction: column;
        gap: var(--space-4);
        padding: var(--space-6);
      }

      .panel p,
      .skill p,
      .step p {
        color: var(--color-muted);
      }

      .panel ul,
      .skill ul,
      .hero-card ul {
        margin: 0;
        padding-left: 20px;
        color: var(--color-muted);
      }

      .panel li + li,
      .skill li + li,
      .hero-card li + li {
        margin-top: var(--space-2);
      }

      .skill {
        position: relative;
        display: flex;
        min-height: 100%;
        flex-direction: column;
        gap: var(--space-4);
        overflow: hidden;
        padding: var(--space-5);
      }

      .skill::before {
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: var(--color-accent);
        content: "";
      }

      .skill:nth-child(2n)::before {
        background: var(--color-indigo);
      }

      .skill:nth-child(3n)::before {
        background: var(--color-rose);
      }

      .skill:nth-child(4n)::before {
        background: var(--color-amber);
      }

      .skill .tag,
      .step .number {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 800;
      }

      .skill .tag {
        padding: 4px 8px;
        background: var(--color-accent-soft);
        color: var(--color-accent-strong);
        word-break: break-word;
      }

      .skill h3 {
        min-height: 46px;
      }

      .flow {
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: var(--space-3);
      }

      .step {
        position: relative;
        display: flex;
        min-height: 196px;
        flex-direction: column;
        gap: var(--space-3);
        padding: var(--space-5);
      }

      .step .number {
        padding: 3px 8px;
        background: var(--color-indigo-soft);
        color: var(--color-indigo);
      }

      .chain {
        display: grid;
        gap: var(--space-2);
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .chain li {
        display: flex;
        align-items: center;
        gap: var(--space-2);
      }

      .chain li + li::before {
        display: inline-grid;
        width: 22px;
        height: 22px;
        place-items: center;
        border-radius: 999px;
        background: var(--color-accent-soft);
        color: var(--color-accent-strong);
        content: "↓";
        font-size: 13px;
        font-weight: 900;
      }

      .pairing-route {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        align-items: center;
      }

      .pairing-arrow {
        color: var(--color-muted);
        font-weight: 900;
      }

      .prompt-list {
        display: grid;
        gap: var(--space-3);
      }

      .prompt {
        margin: 0;
        padding: var(--space-4);
        overflow: auto;
        background: var(--color-code);
        color: var(--color-code-text);
        font-family: var(--font-code);
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .prompt code {
        border-color: var(--color-code-overlay-line);
        background: var(--color-code-overlay-soft);
        color: var(--color-code-text);
      }

      .notice {
        border-color: var(--color-notice-line);
        background: var(--color-amber-soft);
      }

      .notice strong {
        color: var(--color-amber);
      }

      .output-grid {
        align-items: stretch;
      }

      footer {
        margin-top: var(--space-8);
        padding: var(--space-5) 0 0;
        color: var(--color-muted);
        font-size: 14px;
      }

      @media (max-width: 1120px) {
        .topbar {
          grid-template-columns: 1fr auto;
        }

        .section-nav {
          grid-column: 1 / -1;
          justify-content: flex-start;
          order: 3;
        }

        .hero {
          grid-template-columns: 1fr;
        }

        .grid.four,
        .flow {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 720px) {
        .page {
          padding: var(--space-3) var(--space-4) 52px;
        }

        .topbar {
          margin: 0 calc(var(--space-4) * -1) var(--space-4);
          padding: var(--space-3) var(--space-4);
        }

        .brand span:last-child {
          display: none;
        }

        .language-switcher button {
          min-width: 44px;
          padding: 7px 8px;
        }

        .hero {
          gap: var(--space-5);
          padding: var(--space-5);
        }

        h1 {
          font-size: 38px;
        }

        h2 {
          font-size: 24px;
        }

        .lead {
          font-size: 16px;
        }

        .grid.two,
        .grid.four,
        .flow {
          grid-template-columns: 1fr;
        }

        .section {
          padding-top: var(--space-8);
        }

        .section-header {
          align-items: start;
          flex-direction: column;
        }

        .section-header::after {
          width: 100%;
        }

        .step {
          min-height: auto;
        }
      }
    </style>
  </head>
  <body>

      </div>
      <div id="content" aria-live="polite"></div>

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function detectLanguage() {
        const stored = window.localStorage.getItem("cm-skills-language");
        if (stored && copy[stored]) return stored;
        const languages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language || "en"];
        for (const language of languages) {
          const normalized = language.toLowerCase();
          if (normalized.startsWith("ja") || normalized.startsWith("jp")) return "ja";
          if (normalized.startsWith("zh")) return "zh-Hant";
          if (normalized.startsWith("en")) return "en";
        }
        return "en";
      }

      function renderList(items, code = false) {
        return `<ul>${items
          .map((item) => `<li>${code ? `<code>${escapeHtml(item)}</code>` : escapeHtml(item)}</li>`)
          .join("")}</ul>`;
      }

      function renderNav(lang) {
        return copy[lang].navItems
          .map((item) => `<a href="${escapeHtml(item.href)}">${escapeHtml(item.label)}</a>`)
          .join("");
      }

      function renderChain(items) {
        return `<ol class="chain">${items
          .map((item) => `<li><code>${escapeHtml(item)}</code></li>`)
          .join("")}</ol>`;
      }

      function renderSkillCards(lang) {
        return skillData
          .map((skill) => {
            const localized = copy[lang].skills[skill.key];
            return `
              <article class="skill">
                <span class="tag">${escapeHtml(skill.tag)}</span>
                <h3>${escapeHtml(localized.title)}</h3>
                <p>${escapeHtml(localized.body)}</p>
                ${renderList(skill.bullets[lang])}
              </article>
            `;
          })
          .join("");
      }

      function renderFlow(lang) {
        return copy[lang].flow
          .map(
            (item, index) => `
              <article class="step">
                <span class="number">${String(index + 1).padStart(2, "0")}</span>
                <h3>${escapeHtml(item.title)}</h3>
                <p>${escapeHtml(item.body)}</p>
              </article>
            `,
          )
          .join("");
      }

      function renderWorkflows(lang) {
        return copy[lang].workflows
          .map(
            (item) => `
              <article class="panel">
                <h3>${escapeHtml(item.title)}</h3>
                <p>${escapeHtml(item.body)}</p>
                ${renderChain(item.steps)}
              </article>
            `,
          )
          .join("");
      }

      function renderPairings(lang) {
        return copy[lang].pairings
          .map(
            (item) => `
              <article class="panel">
                <h3 class="pairing-route">
                  <code>${escapeHtml(item.from)}</code>
                  <span class="pairing-arrow" aria-hidden="true">&rarr;</span>
                  <code>${escapeHtml(item.to)}</code>
                </h3>
                <p>${escapeHtml(item.body)}</p>
              </article>
            `,
          )
          .join("");
      }

      function renderPrompts(lang) {
        return copy[lang].prompts
          .map((prompt) => `<pre class="prompt">${escapeHtml(prompt)}</pre>`)
          .join("");
      }

      function render(lang) {
        const text = copy[lang];
        document.documentElement.lang = lang;
        document.title = text.title;
        document.querySelectorAll("[data-lang]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
        });
        document.getElementById("section-nav").innerHTML = renderNav(lang);
        document.getElementById("content").innerHTML = `
          <header id="agent-usage" class="hero">
            <div class="hero-copy">
              <p class="eyebrow">${escapeHtml(text.eyebrow)}</p>
              <h1>${escapeHtml(text.title)}</h1>
              <p class="lead">${escapeHtml(text.lead)}</p>
              <div class="meta" aria-label="Highlights">
                ${text.pills.map((pill) => `<span class="pill">${escapeHtml(pill)}</span>`).join("")}
              </div>
            </div>
            <aside class="hero-card" aria-labelledby="agent-usage-card">
              <p id="agent-usage-card" class="card-label">${escapeHtml(text.agentTitle)}</p>
              <p>${escapeHtml(text.agentBody)}</p>
              ${renderList(text.agentSteps)}
            </aside>
          </header>

          <section class="section" aria-labelledby="quick-choice">
            <div class="section-header">
              <h2 id="quick-choice">${escapeHtml(text.quickChoice)}</h2>
            </div>
            <div class="grid four">${renderSkillCards(lang)}</div>
          </section>

          <section class="section" aria-labelledby="recommended-flow">
            <div class="section-header">
              <h2 id="recommended-flow">${escapeHtml(text.recommendedFlow)}</h2>
            </div>
            <div class="flow">${renderFlow(lang)}</div>
          </section>

          <section class="section" aria-labelledby="workflow-combinations">
            <div class="section-header">
              <h2 id="workflow-combinations">${escapeHtml(text.workflowTitle)}</h2>
            </div>
            <div class="grid two">${renderWorkflows(lang)}</div>
          </section>

          <section class="section" aria-labelledby="skill-pairings">
            <div class="section-header">
              <h2 id="skill-pairings">${escapeHtml(text.pairingsTitle)}</h2>
            </div>
            <div class="grid two">${renderPairings(lang)}</div>
          </section>

          <section class="section" aria-labelledby="examples">
            <div class="section-header">
              <h2 id="examples">${escapeHtml(text.examples)}</h2>
            </div>
            <div class="grid two">
              <div class="prompt-list" aria-label="Prompt examples">
                ${renderPrompts(lang)}
              </div>
              <aside class="panel notice">
                <h3>${escapeHtml(text.principleTitle)}</h3>
                <p><strong>${escapeHtml(text.principleStrong)}</strong> ${escapeHtml(text.principleBody)}</p>
              </aside>
            </div>
          </section>

          <section class="section" aria-labelledby="outputs">
            <div class="section-header">
              <h2 id="outputs">${escapeHtml(text.outputs)}</h2>
            </div>
            <div class="grid two output-grid">
              <article class="panel">
                <h3>${escapeHtml(text.extractOutputTitle)}</h3>
                ${renderList(text.extractOutputs, true)}
              </article>
              <article class="panel">
                <h3>${escapeHtml(text.storybookOutputTitle)}</h3>
                ${renderList(text.storybookOutputs)}
              </article>
              <article class="panel">
                <h3>${escapeHtml(text.pixelReportOutputTitle)}</h3>
                ${renderList(text.pixelReportOutputs, true)}
              </article>
            </div>
          </section>

          <footer>
            <p>${escapeHtml(text.footer)}</p>
          </footer>
        `;
      }

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => {
          const lang = button.dataset.lang;
          window.localStorage.setItem("cm-skills-language", lang);
          render(lang);
        });
      });

      render(detectLanguage());
    </script>
