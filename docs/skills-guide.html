<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CM Skills — 我該用哪一個？</title>
    <style>
      :root {
        --bg: #0d0d11;
        --panel: #1a1a22;
        --panel-2: #23232c;
        --line: #2b2b35;
        --line-soft: #26262f;

        --text: #eeeef3;
        --text-2: #bcbcc8;
        --muted: #8c8c9c;
        --dim: #66667a;

        --accent: #cf3a68;
        --accent-bright: #e97396;
        --accent-deep: #98254a;

        --r-sm: 5px;   /* controls: tabs, options, chips, inputs */
        --r-md: 18px;  /* card surfaces */

        --topbar: 58px;

        --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", ui-sans-serif,
          system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;

        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.8;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

      /* rings on elements inside clipped containers must draw inward */
      .skill-top:focus-visible, .tabs a:focus-visible { outline-offset: -2px; }

      /* the page's one decorative device: a vertical rule beside text */
      .vrule { position: relative; padding-left: 18px; }

      .vrule::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.35em;
        bottom: 0.35em;
        width: 2px;
        border-radius: 1px;
        background: var(--accent);
      }

      .vrule.quiet::before { background: var(--line); }

      /* ---------------------------------------------------------- app shell */

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        height: var(--topbar);
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 0 26px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--text);
        text-decoration: none;
        flex: none;
      }

      .brand-mark { width: 18px; height: 18px; border-radius: 4px; background: var(--accent); }

      .brand-name {
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .tabs {
        display: flex;
        align-items: center;
        gap: 4px;
        overflow-x: auto;
        min-width: 0;
      }

      .tabs a {
        padding: 8px 14px;
        border-radius: var(--r-sm);
        color: var(--text-2);
        text-decoration: none;
        font-size: 14.5px;
        white-space: nowrap;
        transition: background 0.18s var(--ease), color 0.18s var(--ease);
      }

      .tabs a:hover { background: var(--panel); color: var(--text); }
      .tabs a.active { background: var(--panel-2); color: var(--text); font-weight: 600; }

      .top-count {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        color: var(--muted);
        font-family: var(--mono);
        white-space: nowrap;
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: blink 2.4s ease-in-out infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .canvas { padding: 34px 26px 90px; max-width: 1080px; margin: 0 auto; }

      .view-enter { animation: view-in 0.4s var(--ease); }

      @keyframes view-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }

      /* ------------------------------------------------------------ blocks */

      .section { margin-bottom: 54px; }

      .kicker {
        font-size: 12.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--dim);
        font-family: var(--mono);
        margin-bottom: 9px;
      }

      h2.title {
        margin: 0 0 8px;
        font-size: 26px;
        line-height: 1.45;
        font-weight: 680;
        letter-spacing: -0.015em;
      }

      h2.title .q { color: var(--accent); }

      .sub { margin: 0; color: var(--text-2); font-size: 15.5px; max-width: 68ch; }

      .lbl {
        font-size: 12.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
        font-family: var(--mono);
        margin-bottom: 10px;
      }

      .card { background: var(--panel); border-radius: var(--r-md); padding: 24px; }

      .new-badge {
        display: inline-block;
        font-family: var(--mono);
        font-size: 11.5px;
        letter-spacing: 0.08em;
        color: var(--accent-bright);
        background: var(--panel-2);
        border-radius: 4px;
        padding: 2px 8px;
        transform: translateY(-2px);
        margin-left: 8px;
      }

      /* --------------------------------------------------------------- hero */

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
        align-items: start;
        gap: 18px;
        margin-bottom: 48px;
      }

      .hero-main h2 {
        margin: 0 0 14px;
        font-size: 29px;
        line-height: 1.5;
        font-weight: 680;
        letter-spacing: -0.02em;
      }

      .hero-main p { margin: 0 0 14px; color: var(--text-2); font-size: 15.5px; }
      .hero-main p:last-of-type { margin-bottom: 0; }

      .hero-cta {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        margin-top: 20px;
        padding: 11px 16px;
        background: var(--panel-2);
        border-radius: var(--r-sm);
        color: var(--text);
        text-decoration: none;
        font-size: 14.5px;
        transition: color 0.2s var(--ease), background 0.2s var(--ease);
      }

      .hero-cta .tag { color: var(--dim); font-size: 12.5px; letter-spacing: 0.06em; }
      .hero-cta:hover { color: var(--accent-bright); }

      .hero-side { display: grid; gap: 14px; align-content: start; }

      .fact { display: flex; align-items: baseline; gap: 14px; }

      .fact .n {
        font-size: 30px;
        font-weight: 700;
        font-family: var(--mono);
        letter-spacing: -0.02em;
        color: var(--accent);
        line-height: 1.2;
        min-width: 42px;
      }

      .fact .t { font-size: 15px; color: var(--text-2); }

      /* --------------------------------------------------------- goal cards */

      .goal-group { margin-bottom: 34px; }

      .goals {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(264px, 1fr));
        gap: 12px;
      }

      .goal {
        position: relative;
        display: block;
        background: var(--panel);
        border-radius: var(--r-md);
        padding: 18px 19px 17px;
        color: inherit;
        text-decoration: none;
        transition: background 0.2s var(--ease), transform 0.2s var(--ease);
      }

      .goal:hover { background: var(--panel-2); transform: translateY(-2px); }

      .goal .inner { display: block; position: relative; padding-left: 16px; }

      .goal .inner::before {
        content: "";
        position: absolute;
        left: 0;
        top: 5px;
        bottom: 4px;
        width: 2px;
        border-radius: 1px;
        background: var(--line);
        transition: background 0.22s var(--ease);
      }

      .goal:hover .inner::before { background: var(--accent); }

      .goal .say {
        display: block;
        font-size: 16px;
        font-weight: 640;
        line-height: 1.6;
        margin-bottom: 5px;
        padding-right: 24px;
      }

      .goal .then { display: block; font-size: 14.5px; color: var(--muted); line-height: 1.7; }

      .goal .go {
        position: absolute;
        top: 16px;
        right: 16px;
        font-family: var(--mono);
        font-size: 13px;
        color: var(--dim);
        transition: color 0.2s var(--ease), transform 0.2s var(--ease);
      }

      .goal:hover .go { color: var(--accent-bright); transform: translateX(3px); }

      /* -------------------------------------------------------- journey view */

      .back {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 22px;
        color: var(--muted);
        text-decoration: none;
        font-size: 14px;
        font-family: var(--mono);
        transition: color 0.18s var(--ease);
      }

      .back:hover { color: var(--accent-bright); }

      .j-head { margin-bottom: 30px; }
      .j-head .goal-line { color: var(--text-2); font-size: 15.5px; max-width: 68ch; }

      .flow-scroll { overflow-x: auto; padding: 4px 2px 12px; }
      .flow-track { display: flex; align-items: stretch; min-width: min-content; }

      .stage {
        flex: 0 0 226px;
        background: var(--panel);
        border-radius: var(--r-md);
        padding: 17px 18px;
        opacity: 0;
        transform: translateY(10px);
        animation: stage-in 0.5s var(--ease) forwards;
        transition: background 0.2s var(--ease);
      }

      .stage:hover { background: var(--panel-2); }

      @keyframes stage-in { to { opacity: 1; transform: translateY(0); } }

      .link {
        flex: 0 0 40px;
        position: relative;
        align-self: center;
        height: 2px;
        background: var(--line);
        overflow: hidden;
      }

      .link::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 14px;
        background: var(--accent);
        animation: flow 2.2s linear infinite;
        animation-delay: var(--delay, 0s);
      }

      @keyframes flow {
        from { transform: translateX(-14px); }
        to { transform: translateX(40px); }
      }

      .stage .num {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        letter-spacing: 0.1em;
        margin-bottom: 8px;
      }

      .stage .name { font-size: 16px; font-weight: 640; margin-bottom: 7px; line-height: 1.5; }
      .stage .desc { font-size: 14.5px; color: var(--muted); line-height: 1.72; }

      .stage .who {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--line-soft);
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--text-2);
        word-break: break-all;
      }

      .scroll-note {
        font-size: 13.5px;
        color: var(--dim);
        font-family: var(--mono);
        margin: 0 0 8px;
        display: none;
      }

      .scroll-note.show { display: block; }

      .j-io {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 26px;
      }

      .io ul { margin: 0; padding-left: 20px; color: var(--text-2); font-size: 15px; }
      .io li { margin-bottom: 4px; }

      .notes { display: grid; gap: 12px; }

      .note-item { color: var(--text-2); font-size: 15px; line-height: 1.8; }
      .note-item strong { color: var(--text); font-weight: 640; }

      .related { display: flex; flex-wrap: wrap; gap: 9px; }

      .rel-chip {
        font-size: 14px;
        padding: 8px 15px;
        border-radius: var(--r-sm);
        background: var(--panel);
        color: var(--text-2);
        text-decoration: none;
        transition: background 0.18s var(--ease), color 0.18s var(--ease);
      }

      .rel-chip:hover { background: var(--panel-2); color: var(--accent-bright); }

      /* ------------------------------------------------------------ widgets */

      .widget { background: var(--panel); border-radius: var(--r-md); padding: 22px; }

      .w-grid { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.15fr); gap: 30px; }

      .picker-group { margin-bottom: 22px; }
      .picker-group:last-child { margin-bottom: 0; }

      .opts { display: grid; gap: 8px; }

      .opt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 13px 15px;
        border: 0;
        border-radius: var(--r-sm);
        background: var(--panel-2);
        color: var(--text-2);
        font: inherit;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
        transition: color 0.18s var(--ease);
      }

      .opt:hover { color: var(--text); }
      .opt[aria-pressed="true"] { color: var(--text); }

      .opt .mark {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid var(--dim);
        flex: none;
        position: relative;
        transition: border-color 0.18s var(--ease);
      }

      .opt[aria-pressed="true"] .mark { border-color: var(--accent); }

      .opt .mark::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: var(--accent);
        transform: scale(0);
        transition: transform 0.22s var(--ease);
      }

      .opt[aria-pressed="true"] .mark::after { transform: scale(1); }

      .field { margin-bottom: 16px; }
      .field:last-child { margin-bottom: 0; }

      .field input, .field textarea {
        width: 100%;
        background: var(--panel-2);
        border: 0;
        border-radius: var(--r-sm);
        color: var(--text);
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 1.7;
        padding: 11px 13px;
        resize: vertical;
      }

      .field input::placeholder, .field textarea::placeholder { color: var(--dim); }

      .pills { display: flex; flex-wrap: wrap; gap: 8px; }

      .pill {
        font: inherit;
        font-size: 14.5px;
        padding: 8px 16px;
        border-radius: var(--r-sm);
        border: 0;
        background: var(--panel-2);
        color: var(--muted);
        cursor: pointer;
        transition: color 0.18s var(--ease);
      }

      .pill:hover { color: var(--text); }
      .pill[aria-pressed="true"] { color: var(--accent-bright); font-weight: 600; }

      .verdict .say { font-size: 17px; font-weight: 650; line-height: 1.6; margin-bottom: 7px; }
      .verdict .note { font-size: 14.5px; color: var(--text-2); line-height: 1.8; }
      .verdict.swap { animation: swap-in 0.34s var(--ease); }

      @keyframes swap-in {
        from { opacity: 0.3; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .chain { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

      .chain-node {
        font-family: var(--mono);
        font-size: 12.5px;
        padding: 6px 12px;
        border-radius: var(--r-sm);
        background: var(--panel-2);
        color: var(--text-2);
      }

      .chain-node.end { color: var(--accent-bright); }
      .chain-arrow { color: var(--dim); font-size: 13px; }

      .result-stack { display: grid; gap: 20px; align-content: start; }

      /* checklist */

      .checklist { display: grid; gap: 8px; }

      .check {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 13px 15px;
        border: 0;
        border-radius: var(--r-sm);
        background: var(--panel-2);
        color: var(--text-2);
        font: inherit;
        font-size: 15px;
        line-height: 1.7;
        text-align: left;
        cursor: pointer;
        transition: color 0.18s var(--ease);
      }

      .check .box {
        width: 17px;
        height: 17px;
        border-radius: 4px;
        border: 1.5px solid var(--dim);
        flex: none;
        margin-top: 5px;
        display: grid;
        place-items: center;
        transition: border-color 0.18s var(--ease), background 0.18s var(--ease);
      }

      .check .box svg { width: 11px; height: 11px; opacity: 0; transition: opacity 0.18s var(--ease); }

      .check[aria-pressed="true"] { color: var(--text); }
      .check[aria-pressed="true"] .box { border-color: var(--accent); background: var(--accent); }
      .check[aria-pressed="true"] .box svg { opacity: 1; }

      .check-progress { margin-top: 14px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
      .check-progress .ok { color: var(--accent-bright); }

      /* -------------------------------------------------------------- code */

      .code {
        position: relative;
        background: var(--panel);
        border-radius: var(--r-md);
        padding: 15px 50px 15px 18px;
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 1.8;
        color: var(--text-2);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .widget .code, .w-grid .code { background: var(--panel-2); }

      .code .tok { color: var(--accent-bright); }
      .code .ph { color: var(--dim); }

      .copy {
        position: absolute;
        top: 9px;
        right: 9px;
        width: 30px;
        height: 30px;
        border: 0;
        background: none;
        color: var(--dim);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: color 0.18s var(--ease);
      }

      .copy:hover { color: var(--text); }
      .copy.done { color: var(--accent); }
      .copy svg { width: 14px; height: 14px; }
      .copy .tick { display: none; }
      .copy.done .clip { display: none; }
      .copy.done .tick { display: block; animation: pop 0.3s var(--ease); }

      @keyframes pop {
        from { transform: scale(0.4); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      .prompt-list { display: grid; gap: 10px; }
      .prompt-label { font-size: 13.5px; color: var(--muted); margin: 4px 0 6px; }

      /* ------------------------------------------------------------- skills */

      .skill-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }

      .chip {
        font: inherit;
        font-size: 14.5px;
        padding: 8px 16px;
        border-radius: var(--r-sm);
        border: 0;
        background: var(--panel);
        color: var(--muted);
        cursor: pointer;
        transition: color 0.18s var(--ease), background 0.18s var(--ease);
      }

      .chip:hover { background: var(--panel-2); color: var(--text); }
      .chip[aria-pressed="true"] { background: var(--panel-2); color: var(--accent-bright); font-weight: 600; }

      .skill-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(324px, 1fr));
        align-items: start;
        gap: 12px;
      }

      .skill {
        background: var(--panel);
        border-radius: var(--r-md);
        overflow: hidden;
        transition: background 0.2s var(--ease);
      }

      .skill.hide { display: none; }
      .skill:hover, .skill.open { background: var(--panel-2); }

      .skill-top {
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        color: inherit;
        font: inherit;
        padding: 17px 18px;
        cursor: pointer;
        display: grid;
        gap: 7px;
      }

      .skill-when {
        font-size: 16px;
        font-weight: 640;
        line-height: 1.6;
        padding-right: 24px;
        position: relative;
      }

      .skill-when::after {
        content: "";
        position: absolute;
        right: 3px;
        top: 9px;
        width: 8px;
        height: 8px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(45deg);
        transition: transform 0.26s var(--ease);
      }

      .skill.open .skill-when::after { transform: rotate(-135deg); }

      .skill-tag {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--accent-bright);
        word-break: break-all;
      }

      .skill-note-tag { color: var(--dim); font-family: var(--mono); font-size: 12.5px; }

      .skill-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.34s var(--ease); }
      .skill.open .skill-body { grid-template-rows: 1fr; }
      .skill-body > div { overflow: hidden; }

      .skill-inner {
        padding: 15px 18px 18px;
        display: grid;
        gap: 14px;
        border-top: 1px solid var(--line-soft);
      }

      .kv { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 12px; }
      .kv .k { color: var(--dim); font-size: 12.5px; font-family: var(--mono); padding-top: 3px; }
      .kv .v { color: var(--text-2); font-size: 14.5px; line-height: 1.75; }

      .skill-journey-link {
        justify-self: start;
        font-size: 14px;
        color: var(--accent-bright);
        text-decoration: none;
      }

      .skill-journey-link:hover { text-decoration: underline; text-underline-offset: 3px; }

      /* -------------------------------------------------------------- misc */

      .rule h3 { margin: 0 0 7px; font-size: 17px; font-weight: 650; }
      .rule p { margin: 0; color: var(--text-2); font-size: 15.5px; }

      footer {
        border-top: 1px solid var(--line);
        margin-top: 40px;
        padding-top: 22px;
        color: var(--muted);
        font-size: 14px;
        display: grid;
        gap: 8px;
      }

      footer a { color: var(--accent-bright); text-decoration: none; }
      footer a:hover { text-decoration: underline; text-underline-offset: 3px; }

      /* ------------------------------------------------------- responsive */

      @media (max-width: 900px) {
        .hero { grid-template-columns: 1fr; }
        .w-grid { grid-template-columns: 1fr; gap: 24px; }
      }

      @media (max-width: 700px) {
        body { font-size: 15.5px; }
        .canvas { padding: 24px 16px 70px; }
        .topbar { padding: 0 14px; gap: 12px; }
        .top-count { display: none; }
        .brand-name { display: none; }
        .hero-main h2 { font-size: 24px; }
        h2.title { font-size: 22px; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-delay: 0s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">CM Skills</span>
      </a>
      <nav class="tabs" id="tabs" aria-label="主導覽">

      /* ===========================================================  helpers */

      const esc = (v) =>

      const journeyHref = (id) => `#/j/${id}`;

      /* ============================================================= journey */

      function renderStages(journey) {
        return journey.stages
          .map(
            (stage, index) => `
            ${index > 0 ? `<div class="link" style="--delay:${index * 0.26}s"></div>` : ""}

              <div class="desc">${esc(stage.desc)}</div>

            </div>`,
          )
          .join("");
      }

      function renderJourney(journey) {
        const related = (journey.related || [])
          .map((id) => journeys.find((j) => j.id === id))
          .filter(Boolean)
          .map((j) => `<a class="rel-chip" href="${journeyHref(j.id)}">${esc(j.say)} →</a>`)
          .join("");

        const prompts = (journey.prompts || [])
          .map((p) => `${p.label ? `<div class="prompt-label">${esc(p.label)}</div>` : ""}${codeBlock(p.text)}`)
          .join("");

        return `

          <div class="j-head vrule">
            <div class="kicker">Journey</div>
            <h2 class="title">${esc(journey.say)}${journey.isNew ? '<span class="new-badge">新</span>' : ""}</h2>

      /* ------------------------------------------------------------ matcher */

      const matcherState = { source: "figma", target: "web" };

      function renderMatcherResult() {
        const key = `${matcherState.source}|${matcherState.target}`;
        const source = matcher.sources.find((s) => s.id === matcherState.source);
        const target = matcher.targets.find((t) => t.id === matcherState.target);
        const info = matcher.cases[key];
        const example = matcher.examples[key];

        return `
          <div class="verdict swap vrule">
            <div class="say">${esc(info.say)}</div>
            <div class="note">${esc(info.note)}</div>
          </div>
          <div class="chain">
            <span class="chain-node">${esc(source.label)}</span>
            <span class="chain-arrow">→</span>
            <span class="chain-node">抽成同一份規格</span>
            <span class="chain-arrow">→</span>
            <span class="chain-node">分出該修／該留</span>
            <span class="chain-arrow">→</span>

          </div>
          <div>
            <div class="lbl">直接複製這句</div>
            ${codeBlock(example)}
          </div>
          <div class="verdict vrule quiet">
            <div class="note">${esc(source.note)}</div>
          </div>`;
      }

      /* ------------------------------------------------ hub checklist widget */

      const hubChecks = [

        { id: "manual", text: "裝完記得：Figma Desktop → Plugins → Development → Import plugin from manifest（這步 AI 不會代勞）" },
      ];

      const hubState = { done: new Set() };

      const tickSvg = `<svg viewBox="0 0 16 16" fill="none" stroke="#0d0d11" stroke-width="2.5" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 5" /></svg>`;

      function renderHubProgress() {
        const n = hubState.done.size;
        if (n === hubChecks.length) return `<span class="ok">✓ 四項都完成了</span>`;
        if (["contract", "identity", "dryrun"].every((id) => hubState.done.has(id)))
          return `<span class="ok">✓ 安裝前的三項都確認了 — 可以請 AI 安裝，最後一項裝完再回來勾</span>`;
        return `${n} / ${hubChecks.length} 確認`;
      }

      function renderHubWidget() {
        return `
          <div class="lbl">安裝前後的四個確認（點一下打勾）</div>
          <div class="widget">
            <div class="checklist">
              ${hubChecks
                .map(
                  (c) => `
                <button class="check" type="button" data-check="${c.id}" aria-pressed="${String(hubState.done.has(c.id))}">
                  <span class="box" aria-hidden="true">${tickSvg}</span>
                  <span>${esc(c.text)}</span>
                </button>`,
                )
                .join("")}
            </div>
            <div class="check-progress" id="hub-progress">${renderHubProgress()}</div>
          </div>`;
      }

      const widgetRenderers = {
        "matcher": renderMatcherWidget,
        "tools-install": renderToolsWidget,
        "automation": renderAutoWidget,
        "hub-checklist": renderHubWidget,
      };

      /* ============================================================== skills */

      function renderSkillsView() {
        const cats = [...new Set(skills.map((s) => s.group))];
        return `
          <div class="vrule" style="margin-bottom:26px">
            <div class="kicker">Catalog</div>
            <h2 class="title">${skills.length} 個 skill，分成四類</h2>
            <p class="sub">點一張卡看細節：你要給它什麼、它會回你什麼。不用背名字 — 不確定要用哪個時，回「選目標」用旅程找更快。</p>
          </div>
          <div class="skill-filter" id="skill-filter">
            <button class="chip" type="button" data-group="all" aria-pressed="true">全部</button>
            ${cats.map((g) => `<button class="chip" type="button" data-group="${esc(g)}" aria-pressed="false">${esc(g)}</button>`).join("")}
          </div>
          <div class="skill-grid" id="skill-grid">
            ${skills
              .map(
                (skill) => `
              <article class="skill" data-group="${esc(skill.group)}">
                <button class="skill-top" type="button" aria-expanded="false">
                  <span class="skill-when">${esc(skill.when)}${skill.badge ? `<span class="new-badge">${esc(skill.badge)}</span>` : ""}</span>
                  <span class="skill-tag">${esc(skill.tag)}${skill.external ? ' <span class="skill-note-tag">· 需另外安裝</span>' : ""}</span>
                </button>
                <div class="skill-body"><div><div class="skill-inner">
                  <div class="kv"><div class="k">你給</div><div class="v">${esc(skill.give)}</div></div>
                  <div class="kv"><div class="k">你拿到</div><div class="v">${esc(skill.get)}</div></div>
                  <div class="kv"><div class="k">要知道</div><div class="v">${esc(skill.note)}</div></div>
                  ${skill.journey ? `<a class="skill-journey-link" href="${journeyHref(skill.journey)}">看它在旅程裡的位置 →</a>` : ""}
                </div></div></div>
              </article>`,
              )
              .join("")}
          </div>`;
      }

      /* ============================================================= prompts */

      function renderPromptsView() {
        return `
          <div class="vrule" style="margin-bottom:26px">
            <div class="kicker">Cheat sheet</div>
            <h2 class="title">怎麼跟 AI 開口</h2>
            <p class="sub">照抄任何一句，把連結和路徑換成你自己的就行。句子裡 $ 開頭的字是 skill 的名字，整個照抄、不用改。如果 AI 說不認得這個名字，就告訴它 skill 都放在 skills 專案裡的同名資料夾（例如 $pipeline-board 就在 pipeline-board/），請它先讀那個資料夾裡的 SKILL.md 再照做。</p>
          </div>
          ${promptGroups
            .map(
              (g) => `
            <div class="section">
              <div class="lbl">${esc(g.title)}</div>
              <div class="prompt-list">${g.items.map((p) => codeBlock(p)).join("")}</div>
            </div>`,
            )
            .join("")}
          <div class="rule vrule">
            <h3>唯一一條原則：不要跳過設計系統那層</h3>
            <p>有 token 或共用元件就先用它、先改它，再處理單一畫面。跳過這層當下會快一點，但之後每個畫面都會愈長愈不一樣，最後誰都不敢改。</p>
          </div>`;
      }

      /* ============================================================== footer */

      function renderFooter() {
        return `
          <footer>
            <div>這頁是入口，不是規格書。每個 skill 的完整規則以它資料夾裡的 SKILL.md 為準；<code>storybook-tools-install</code>、<code>agent-automation-orchestrate</code>、<code>design-automation-hub-install</code> 另有中文 README。</div>
            <div><a href="${REPO_URL}" target="_blank" rel="noopener">GitHub 上的原始碼</a> ・ <a href="designer-guide-storybook-to-production.html">設計師指南：從 Storybook 到上線</a></div>
          </footer>`;
      }

      /* ============================================================== router */

      const viewEl = document.getElementById("view");
      document.getElementById("skill-count").textContent = `${skills.length} skills`;

      function setTab(tabId) {
        document.querySelectorAll("#tabs a").forEach((a) => {
          a.classList.toggle("active", a.dataset.tab === tabId);
        });
      }

      let unwireScrollHint = null;

      function wireScrollHint() {
        const scroller = viewEl.querySelector(".flow-scroll");
        const note = viewEl.querySelector(".scroll-note");
        if (!scroller || !note) return;
        const update = () => {
          const more = scroller.scrollWidth - scroller.clientWidth - scroller.scrollLeft > 8;
          note.classList.toggle("show", more);
        };
        scroller.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", update, { passive: true });
        unwireScrollHint = () => window.removeEventListener("resize", update);
        update();
      }

      function mountWidget(journey) {
        const slot = document.getElementById("widget-slot");
        if (!slot || !journey.widget) return;
        const renderer = widgetRenderers[journey.widget];
        if (renderer) slot.innerHTML = renderer();
      }

      let navByClick = false;

      function route() {
        if (unwireScrollHint) {
          unwireScrollHint();
          unwireScrollHint = null;
        }
        const scrollTop = () => {
          if (navByClick) window.scrollTo(0, 0);
          navByClick = false;
        };
        const hash = location.hash || "#/";
        let html = "";
        let tab = "home";
        let title = "CM Skills — 我該用哪一個？";

        const journeyMatch = hash.match(/^#\/j\/([a-z-]+)$/);

        if (journeyMatch) {
          const journey = journeys.find((j) => j.id === journeyMatch[1]);
          if (journey) {
            html = renderJourney(journey);
            title = `${journey.say} — CM Skills`;
            viewEl.innerHTML = `<div class="view-enter">${html}${renderFooter()}</div>`;
            document.title = title;
            setTab("home");
            scrollTop();
            mountWidget(journey);
            wireScrollHint();
            return;
          }
        } else if (hash === "#/skills") {
          html = renderSkillsView();
          tab = "skills";
          title = "工具目錄 — CM Skills";
        } else if (hash === "#/prompts") {
          html = renderPromptsView();
          tab = "prompts";
          title = "口令表 — CM Skills";
        }

        if (!html) {
          html = renderHome();
          tab = "home";
        }

        viewEl.innerHTML = `<div class="view-enter">${html}${renderFooter()}</div>`;
        document.title = title;
        setTab(tab);
        scrollTop();
      }

      window.addEventListener("hashchange", route);
      route();

      /* ======================================================== interactions */

      document.addEventListener("click", async (event) => {
        /* in-page navigation: only user clicks force scroll-to-top (not back/forward) */
        if (event.target.closest('a[href^="#"]')) navByClick = true;

        /* copy buttons */
        const copyBtn = event.target.closest("[data-copy]");
        if (copyBtn) {
          let copied = true;
          try {
            await navigator.clipboard.writeText(copyBtn.dataset.copy);
          } catch {
            const area = document.createElement("textarea");
            area.value = copyBtn.dataset.copy;
            area.setAttribute("readonly", "");
            area.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
            document.body.appendChild(area);
            area.select();
            copied = document.execCommand("copy");
            area.remove();
          }
          if (copied) {
            copyBtn.classList.add("done");
            setTimeout(() => copyBtn.classList.remove("done"), 1400);
          }
          return;
        }

        /* matcher options */
        const srcBtn = event.target.closest("[data-source]");
        if (srcBtn) {
          matcherState.source = srcBtn.dataset.source;
          document.querySelectorAll("[data-source]").forEach((b) => b.setAttribute("aria-pressed", String(b === srcBtn)));
          const out = document.getElementById("matcher-result");
          if (out) out.innerHTML = renderMatcherResult();
          return;
        }
        const tgtBtn = event.target.closest("[data-target]");
        if (tgtBtn) {
          matcherState.target = tgtBtn.dataset.target;
          document.querySelectorAll("[data-target]").forEach((b) => b.setAttribute("aria-pressed", String(b === tgtBtn)));
          const out = document.getElementById("matcher-result");
          if (out) out.innerHTML = renderMatcherResult();
          return;
        }

        /* tools install scope */
        const scopeBtn = event.target.closest("[data-scope]");
        if (scopeBtn) {
          toolsState.scope = scopeBtn.dataset.scope;
          document.querySelectorAll("[data-scope]").forEach((b) => b.setAttribute("aria-pressed", String(b === scopeBtn)));
          const out = document.getElementById("tools-result");
          if (out) out.innerHTML = renderToolsResult();
          return;
        }

        /* automation mode pills */
        const modeBtn = event.target.closest("[data-mode]");
        if (modeBtn) {
          autoState.mode = modeBtn.dataset.mode;
          document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", String(b === modeBtn)));
          const wishGroup = document.getElementById("auto-wish-group");
          if (wishGroup) wishGroup.hidden = autoState.mode !== "setup";
          const out = document.getElementById("auto-result");
          if (out) out.innerHTML = renderAutoResult();
          return;
        }

        /* hub checklist */
        const checkBtn = event.target.closest("[data-check]");
        if (checkBtn) {
          const id = checkBtn.dataset.check;
          if (hubState.done.has(id)) hubState.done.delete(id);
          else hubState.done.add(id);
          checkBtn.setAttribute("aria-pressed", String(hubState.done.has(id)));
          const progress = document.getElementById("hub-progress");
          if (progress) progress.innerHTML = renderHubProgress();
          return;
        }

        /* skill cards */
        const skillTop = event.target.closest(".skill-top");
        if (skillTop) {
          const card = skillTop.closest(".skill");
          const open = card.classList.toggle("open");
          skillTop.setAttribute("aria-expanded", String(open));
          return;
        }

        /* skill filter chips */
        const chip = event.target.closest("#skill-filter [data-group]");
        if (chip) {
          const group = chip.dataset.group;
          document.querySelectorAll("#skill-filter [data-group]").forEach((b) => b.setAttribute("aria-pressed", String(b === chip)));
          document.querySelectorAll("#skill-grid .skill").forEach((card) => {
            card.classList.toggle("hide", group !== "all" && card.dataset.group !== group);
          });
        }
      });

      document.addEventListener("input", (event) => {
        const bind = event.target.dataset && event.target.dataset.bind;
        if (!bind) return;
        if (bind === "tools-path") {
          toolsState.path = event.target.value;
          const out = document.getElementById("tools-result");
          if (out) out.innerHTML = renderToolsResult();
        } else if (bind === "auto-path") {
          autoState.path = event.target.value;
          const out = document.getElementById("auto-result");
          if (out) out.innerHTML = renderAutoResult();
        } else if (bind === "auto-wish") {
          autoState.wish = event.target.value;
          const out = document.getElementById("auto-result");
          if (out) out.innerHTML = renderAutoResult();
        }
      });
    </script>
  </body>
</html>
