<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CM Skills — 我該用哪一個？</title>
    <style>
      :root {
        --bg: #0d0d11;
        --panel: #1a1a22;
        --panel-2: #23232c;
        --line: #2b2b35;
        --line-soft: #26262f;

        --text: #eeeef3;
        --text-2: #bcbcc8;
        --muted: #8c8c9c;
        --dim: #66667a;

        --accent: #cf3a68;
        --accent-bright: #e97396;
        --accent-deep: #98254a;

        --r-sm: 5px;   /* controls: nav items, options, chips */
        --r-md: 18px;  /* card surfaces: hero, situation, stage, skill, code */

        --sidebar: 244px;
        --topbar: 60px;

        --font: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", ui-sans-serif,
          system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, monospace;

        --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.8;
        -webkit-font-smoothing: antialiased;
      }

      /* the page's one decorative device: a vertical rule beside text */
      .vrule {
        position: relative;
        padding-left: 18px;
      }

      .vrule::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0.35em;
        bottom: 0.35em;
        width: 2px;
        border-radius: 1px;
        background: var(--accent);
      }

      .vrule.quiet::before { background: var(--line); }

      /* ---------------------------------------------------------- app shell */

      .app {
        display: grid;
        grid-template-columns: var(--sidebar) minmax(0, 1fr);
        min-height: 100vh;
      }

      .sidebar {
        position: sticky;
        top: 0;
        height: 100vh;
        border-right: 1px solid var(--line);
        background: var(--panel);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .brand {
        height: var(--topbar);
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 20px;
        border-bottom: 1px solid var(--line);
        flex: none;
      }

      .brand-mark {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        background: var(--accent);
        flex: none;
      }

      .brand-name {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      .side-nav { padding: 16px 12px; display: grid; gap: 2px; }

      .side-nav a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 12px;
        border-radius: var(--r-sm);
        color: var(--text-2);
        text-decoration: none;
        font-size: 15px;
        transition: background 0.18s var(--ease), color 0.18s var(--ease);
      }

      .side-nav a::before {
        content: "";
        width: 2px;
        height: 15px;
        border-radius: 1px;
        background: transparent;
        flex: none;
        transition: background 0.18s var(--ease);
      }

      .side-nav a:hover { background: var(--panel-2); color: var(--text); }
      .side-nav a.active { color: var(--text); }
      .side-nav a.active::before { background: var(--accent); }

      .side-foot {
        margin-top: auto;
        padding: 18px 20px 20px;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.75;
      }

      .side-foot code { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); }

      .repo-link {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-bottom: 14px;
        color: var(--accent-bright);
        text-decoration: none;
        font-size: 13.5px;
        font-weight: 600;
        word-break: break-all;
      }

      .repo-link:hover { text-decoration: underline; text-underline-offset: 3px; }
      .repo-link svg { width: 15px; height: 15px; flex: none; }

      .main { min-width: 0; }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 20;
        height: var(--topbar);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 30px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }

      .topbar h1 { margin: 0; font-size: 15.5px; font-weight: 600; }
      .topbar .crumb { color: var(--dim); font-weight: 400; }

      .top-right { display: flex; align-items: center; gap: 18px; }

      .status {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 13px;
        color: var(--muted);
        font-family: var(--mono);
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--accent);
        animation: blink 2.4s ease-in-out infinite;
      }

      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      .canvas { padding: 36px 30px 100px; max-width: 1160px; }

      /* ------------------------------------------------------------ blocks */

      .section { margin-bottom: 64px; scroll-margin-top: 80px; }

      .section-head { margin-bottom: 22px; }

      .kicker {
        font-size: 12.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--dim);
        font-family: var(--mono);
        margin-bottom: 9px;
      }

      .section h2 {
        margin: 0 0 8px;
        font-size: 25px;
        line-height: 1.45;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .section h2 .q { color: var(--accent); }

      .section .sub { margin: 0; color: var(--text-2); font-size: 15.5px; max-width: 70ch; }

      /* cards are surfaces, not outlined boxes — separation comes from fill */
      .card {
        background: var(--panel);
        border-radius: var(--r-md);
        padding: 24px;
      }

      /* --------------------------------------------------------------- hero */

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
        align-items: start;
        gap: 18px;
        margin-bottom: 56px;
      }

      .hero-main h2 {
        margin: 0 0 16px;
        font-size: 30px;
        line-height: 1.45;
        font-weight: 680;
        letter-spacing: -0.02em;
      }

      .hero-main p { margin: 0 0 16px; color: var(--text-2); font-size: 16px; }

      .points { display: grid; gap: 9px; margin-top: 22px; }

      .point {
        display: flex;
        align-items: baseline;
        gap: 11px;
        font-size: 15px;
        color: var(--text-2);
      }

      .point::before {
        content: "";
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
        transform: translateY(-3px);
      }

      .hero-cta {
        display: inline-flex;
        align-items: baseline;
        gap: 10px;
        margin-top: 22px;
        padding: 11px 16px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: var(--r-sm);
        color: var(--text);
        text-decoration: none;
        font-size: 14.5px;
        transition: border-color 0.2s var(--ease), color 0.2s var(--ease);
      }

      .hero-cta .tag { color: var(--dim); font-size: 12.5px; letter-spacing: 0.06em; }

      .hero-cta:hover { border-color: var(--accent); color: var(--accent-bright); }

      .hero-side { display: grid; gap: 12px; align-content: start; }

      .fact { display: flex; align-items: baseline; gap: 14px; }

      .fact .n {
        font-size: 30px;
        font-weight: 700;
        font-family: var(--mono);
        letter-spacing: -0.02em;
        color: var(--accent);
        line-height: 1.2;
        min-width: 46px;
      }

      .fact .t { font-size: 15px; color: var(--text-2); }

      /* --------------------------------------------------- situation picker */

      .situations {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(258px, 1fr));
        gap: 12px;
      }

      .situation {
        position: relative;
        text-align: left;
        background: var(--panel);
        border: 0;
        border-radius: var(--r-md);
        padding: 18px 19px 17px;
        color: inherit;
        font: inherit;
        cursor: pointer;
        transition: background 0.2s var(--ease), transform 0.2s var(--ease);
      }

      .situation:hover { background: var(--panel-2); transform: translateY(-2px); }
      .situation[aria-pressed="true"] { background: var(--panel-2); }

      .situation .inner { display: block; position: relative; padding-left: 16px; }

      .situation .inner::before {
        content: "";
        position: absolute;
        left: 0;
        top: 5px;
        bottom: 4px;
        width: 2px;
        border-radius: 1px;
        background: var(--line);
        transition: background 0.22s var(--ease);
      }

      .situation:hover .inner::before,
      .situation[aria-pressed="true"] .inner::before { background: var(--accent); }

      .situation .say {
        display: block;
        font-size: 16px;
        font-weight: 640;
        line-height: 1.6;
        margin-bottom: 5px;
        padding-right: 28px;
      }

      .situation .then { display: block; font-size: 14.5px; color: var(--muted); line-height: 1.7; }

      .situation .idx {
        position: absolute;
        top: 15px;
        right: 16px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--dim);
      }

      /* ----------------------------------------------------------- flow map */

      .flow-head { margin-bottom: 20px; }
      .flow-title { font-size: 17px; font-weight: 650; line-height: 1.5; }
      .flow-goal { font-size: 15px; color: var(--muted); }

      .flow-scroll { overflow-x: auto; padding: 4px 2px 14px; }

      .flow-track { display: flex; align-items: stretch; min-width: min-content; }

      .stage {
        flex: 0 0 224px;
        background: var(--panel);
        border-radius: var(--r-md);
        padding: 17px 18px;
        opacity: 0;
        transform: translateY(10px);
        animation: stage-in 0.5s var(--ease) forwards;
        transition: background 0.2s var(--ease);
      }

      .stage:hover { background: var(--panel-2); }

      @keyframes stage-in { to { opacity: 1; transform: translateY(0); } }

      .link {
        flex: 0 0 42px;
        position: relative;
        align-self: center;
        height: 2px;
        background: var(--line);
        overflow: hidden;
      }

      .link::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 14px;
        background: var(--accent);
        animation: flow 2.2s linear infinite;
        animation-delay: var(--delay, 0s);
      }

      @keyframes flow {
        from { transform: translateX(-14px); }
        to { transform: translateX(42px); }
      }

      .stage .num {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--accent);
        letter-spacing: 0.1em;
        margin-bottom: 8px;
      }

      .stage .name { font-size: 16px; font-weight: 640; margin-bottom: 7px; line-height: 1.5; }
      .stage .desc { font-size: 14.5px; color: var(--muted); line-height: 1.72; }

      .stage .who {
        margin-top: 12px;
        padding-top: 11px;
        border-top: 1px solid var(--line-soft);
        font-family: var(--mono);
        font-size: 12.5px;
        color: var(--text-2);
        word-break: break-all;
      }

      .scroll-note {
        font-size: 13.5px;
        color: var(--dim);
        font-family: var(--mono);
        margin: 0 0 18px;
        display: none;
      }

      .scroll-note.show { display: block; }

      .flow-io {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 26px;
        margin-top: 6px;
      }

      .lbl {
        font-size: 12.5px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--dim);
        font-family: var(--mono);
        margin-bottom: 8px;
      }

      .io ul { margin: 0; padding-left: 20px; color: var(--text-2); font-size: 15px; }
      .io li { margin-bottom: 4px; }

      /* ------------------------------------------------------------ matcher */

      .matcher { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.15fr); gap: 34px; }

      .picker-group { margin-bottom: 26px; }
      .picker-group:last-child { margin-bottom: 0; }

      .opts { display: grid; gap: 8px; }

      .opt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 16px;
        border: 0;
        border-radius: var(--r-sm);
        background: var(--panel);
        color: var(--text-2);
        font: inherit;
        font-size: 15px;
        text-align: left;
        cursor: pointer;
        transition: background 0.18s var(--ease), color 0.18s var(--ease);
      }

      .opt:hover { background: var(--panel-2); color: var(--text); }
      .opt[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }

      .opt .mark {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1.5px solid var(--dim);
        flex: none;
        position: relative;
        transition: border-color 0.18s var(--ease);
      }

      .opt[aria-pressed="true"] .mark { border-color: var(--accent); }

      .opt .mark::after {
        content: "";
        position: absolute;
        inset: 3px;
        border-radius: 50%;
        background: var(--accent);
        transform: scale(0);
        transition: transform 0.22s var(--ease);
      }

      .opt[aria-pressed="true"] .mark::after { transform: scale(1); }

      .result { display: flex; flex-direction: column; gap: 22px; }

      .verdict.swap { animation: swap-in 0.34s var(--ease); }

      @keyframes swap-in {
        from { opacity: 0.3; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .verdict .say { font-size: 18px; font-weight: 650; line-height: 1.6; margin-bottom: 8px; }
      .verdict .note { font-size: 15px; color: var(--text-2); line-height: 1.8; }

      .chain { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

      .chain-node {
        font-family: var(--mono);
        font-size: 12.5px;
        padding: 6px 12px;
        border-radius: var(--r-sm);
        background: var(--panel);
        color: var(--text-2);
      }

      .chain-node.end { color: var(--accent-bright); }
      .chain-arrow { color: var(--dim); font-size: 13px; }

      /* -------------------------------------------------------------- code */

      .code {
        position: relative;
        background: var(--panel);
        border-radius: var(--r-md);
        padding: 16px 50px 16px 18px;
        font-family: var(--mono);
        font-size: 13.5px;
        line-height: 1.8;
        color: var(--text-2);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .code .tok { color: var(--accent-bright); }

      .copy {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 30px;
        height: 30px;
        border: 0;
        background: none;
        color: var(--dim);
        cursor: pointer;
        display: grid;
        place-items: center;
        transition: color 0.18s var(--ease);
      }

      .copy:hover { color: var(--text); }
      .copy.done { color: var(--accent); }
      .copy svg { width: 14px; height: 14px; }
      .copy .tick { display: none; }
      .copy.done .clip { display: none; }
      .copy.done .tick { display: block; animation: pop 0.3s var(--ease); }

      @keyframes pop {
        from { transform: scale(0.4); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }

      /* ------------------------------------------------------------- skills */

      .skill-filter { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }

      .chip {
        font: inherit;
        font-size: 14.5px;
        padding: 8px 16px;
        border-radius: var(--r-sm);
        border: 0;
        background: var(--panel);
        color: var(--muted);
        cursor: pointer;
        transition: color 0.18s var(--ease), background 0.18s var(--ease);
      }

      .chip:hover { background: var(--panel-2); color: var(--text); }

      .chip[aria-pressed="true"] {
        background: var(--panel-2);
        color: var(--accent-bright);
        font-weight: 600;
      }

      .skill-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(324px, 1fr));
        align-items: start;
        gap: 12px;
      }

      .skill {
        background: var(--panel);
        border-radius: var(--r-md);
        overflow: hidden;
        transition: background 0.2s var(--ease);
      }

      .skill.hide { display: none; }
      .skill:hover,
      .skill.open { background: var(--panel-2); }

      .skill-top {
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        color: inherit;
        font: inherit;
        padding: 17px 18px;
        cursor: pointer;
        display: grid;
        gap: 7px;
      }

      .skill-when {
        font-size: 16px;
        font-weight: 640;
        line-height: 1.6;
        padding-right: 24px;
        position: relative;
      }

      .skill-when::after {
        content: "";
        position: absolute;
        right: 3px;
        top: 9px;
        width: 8px;
        height: 8px;
        border-right: 1.5px solid var(--muted);
        border-bottom: 1.5px solid var(--muted);
        transform: rotate(45deg);
        transition: transform 0.26s var(--ease);
      }

      .skill.open .skill-when::after { transform: rotate(-135deg); }

      .skill-tag {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--accent-bright);
        word-break: break-all;
      }

      .skill-note-tag { color: var(--dim); font-family: var(--mono); font-size: 12.5px; }

      .skill-body {
        display: grid;
        grid-template-rows: 0fr;
        transition: grid-template-rows 0.34s var(--ease);
      }

      .skill.open .skill-body { grid-template-rows: 1fr; }
      .skill-body > div { overflow: hidden; }

      .skill-inner {
        padding: 15px 18px 18px;
        display: grid;
        gap: 14px;
        border-top: 1px solid var(--line-soft);
      }

      .kv { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 12px; }
      .kv .k { color: var(--dim); font-size: 12.5px; font-family: var(--mono); padding-top: 3px; }
      .kv .v { color: var(--text-2); font-size: 14.5px; line-height: 1.75; }

      /* ------------------------------------------------------------ outputs */

      .out-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 30px; }

      .out h3 { margin: 0 0 5px; font-size: 17px; font-weight: 650; }
      .out .hint { margin: 0 0 14px; font-size: 14px; color: var(--muted); }

      .files { display: grid; gap: 7px; }

      .file {
        font-family: var(--mono);
        font-size: 13px;
        color: var(--text-2);
        line-height: 1.6;
        word-break: break-all;
      }

      /* -------------------------------------------------------------- misc */

      .rule h3 { margin: 0 0 7px; font-size: 17px; font-weight: 650; }
      .rule p { margin: 0; color: var(--text-2); font-size: 15.5px; }

      .prompt-list { display: grid; gap: 10px; }

      .reveal {
        opacity: 0;
        transform: translateY(14px);
        transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
      }

      .reveal.seen { opacity: 1; transform: none; }

      footer {
        border-top: 1px solid var(--line);
        margin-top: 26px;
        padding-top: 22px;
        color: var(--muted);
        font-size: 14px;
      }

      footer a { color: var(--accent-bright); text-decoration: none; }
      footer a:hover { text-decoration: underline; text-underline-offset: 3px; }

      /* ------------------------------------------------------- responsive */

      @media (max-width: 980px) {
        .hero { grid-template-columns: 1fr; }
        .matcher { grid-template-columns: 1fr; gap: 26px; }
      }

      @media (max-width: 780px) {
        :root { --sidebar: 0px; }
        body { font-size: 15.5px; }
        .app { grid-template-columns: 1fr; }
        .sidebar { display: none; }
        .canvas { padding: 26px 18px 76px; }
        .topbar { padding: 0 18px; }
        .top-right .status { display: none; }
        .hero-main h2 { font-size: 25px; }
      }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
        .reveal { opacity: 1; transform: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">CM Skills</span>
        </div>
        <nav class="side-nav" id="side-nav" aria-label="頁面導覽"></nav>
        <div class="side-foot">
          <a class="repo-link" href="https://github.com/harrychuang-cm/skills" target="_blank" rel="noopener">

        "用 $storybook-product-prototype 做一個結帳流程的原型和交接文件。",
        "用 $ui-screenshot-to-storybook-product 處理 reference/dashboard.png，用可重用元件實作出來。",
        "用 $ui-pixel-align-report 比對 https://www.figma.com/design/…?node-id=1-234 和 http://localhost:3000/dashboard。",
        "用 $ui-compare-to-reference 比對 https://www.figma.com/design/…?node-id=1-234 和 src/screens/WalletHome.tsx，把落差修掉。",
        "用 $ui-compare-to-reference，以 apps/web/src/pages/Wallet.tsx 為標準，修 apps/mobile/src/screens/WalletHome.tsx。",
        "用 $agent-automation-orchestrate 幫 ./apps/web 設定自動化，我要把 Figma 上標記完成的元件做進 Storybook。",
        "用 $pipeline-board 產生 ./apps/web 的進度看板。",
      ];

      const outputs = [
        {
          title: "設計系統萃取",
          hint: "$design-system-extractor 會在專案裡留下這些",
          files: [
            "design-system/DESIGN_PRINCIPLES.md",
            "design-system/COMPONENT_INVENTORY.md",
            "tokens/tokens-ref.css",
            "tokens/tokens-sys.css",
            "tokens/tokens-comp.css",
            "docs/design-system/index.html",
          ],
        },
        {
          title: "視覺健檢報告",
          hint: "$ui-pixel-align-report 會在專案裡留下這些",
          files: [
            "reports/design-pixel-align/<畫面>/index.html",
            "reports/design-pixel-align/<畫面>/findings.json",
            "reports/design-pixel-align/<畫面>/spec/reference.json",
            "reports/design-pixel-align/<畫面>/spec/implementation.json",
            "設計與實作的完整截圖",
            "每一項落差的並排截圖",
          ],
        },
        {
          title: "Storybook 元件庫",
          hint: "$design-system-to-storybook 會在專案裡留下這些",
          files: [
            "Storybook 基礎樣式文件",
            "共用 UI 元件",
            "每個元件的使用範例與狀態",
            "大量元件時的分批清單",
            "每批的驗證紀錄",
          ],
        },
      ];

      const navItems = [
        { href: "#start", label: "從你的處境開始" },
        { href: "#journey", label: "旅程地圖" },
        { href: "#matcher", label: "修圖配對器" },
        { href: "#skills", label: "13 個 skill" },
        { href: "#prompts", label: "怎麼開口" },
        { href: "#outputs", label: "會產出什麼" },
      ];

      /* ===========================================================  helpers */

      const esc = (v) =>
        String(v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

      const highlight = (v) => esc(v).replace(/(\$[a-z-]+)/g, '<span class="tok">$1</span>');

      const copyIcon = `
        <svg class="clip" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <rect x="5.5" y="5.5" width="8" height="9" rx="1.5" />
          <path d="M10.5 3.5v-1h-8v9h1" />
        </svg>
        <svg class="tick" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M3 8.5l3.5 3.5L13 5" />
        </svg>`;

      const codeBlock = (text) =>
        `<div class="code">${highlight(text)}<button class="copy" type="button" data-copy="${esc(text)}" aria-label="複製">${copyIcon}</button></div>`;

      /* =========================================================== renderers */

      function renderNav() {
        return navItems.map((item) => `<a href="${item.href}">${esc(item.label)}</a>`).join("");
      }

      function renderHero() {
        return `
          <section class="hero">
            <div class="card hero-main">
              <h2>把設計稿變成畫面，<br />再把畫面修回設計稿。</h2>
              <p>這裡是一組給 AI 用的工作說明書。你不用學指令，只要說清楚你現在在哪一步、手上有什麼，AI 就會照著同一套流程做事 — 先建立規則，再做畫面，最後檢查有沒有走樣。</p>
              <p>Cursor、Claude Code、Codex 都能用。往下滑，從「你現在的處境」開始選就好。</p>
              <div class="points">
                <div class="point">先有規則，再做畫面</div>
                <div class="point">修在元件上，不是修在單一畫面</div>
                <div class="point">網頁與 App 可以互為標準</div>
                <div class="point">產出的報告可離線開啟</div>
              </div>
              <a class="hero-cta" href="designer-guide-storybook-to-production.html">
                <span class="tag">設計師指南</span>
                從 Storybook 到上線 — 互動版旅程與情境嚮導 →
              </a>
            </div>
            <div class="card hero-side">
              ${facts.map((f) => `<div class="fact"><span class="n">${esc(f.n)}</span><span class="t">${esc(f.t)}</span></div>`).join("")}
            </div>
          </section>`;
      }

      function renderSituations() {
        return `
          <section class="section reveal" id="start">
            <div class="section-head vrule">
              <div class="kicker">Step 01</div>
              <h2>你現在的處境是<span class="q">？</span></h2>
              <p class="sub">選一個最接近的。下面的旅程地圖會跟著換成那條路線 — 你會知道要做幾步、每一步交給誰、以及你要準備什麼。</p>
            </div>
            <div class="situations" id="situations" role="group" aria-label="選擇你的處境">
              ${journeys
                .map(
                  (j, i) => `
                <button class="situation" type="button" data-journey="${j.id}" aria-pressed="false">
                  <span class="idx">${String(i + 1).padStart(2, "0")}</span>
                  <span class="inner">
                    <span class="say">${esc(j.say)}</span>
                    <span class="then">${esc(j.then)}</span>
                  </span>
                </button>`,
                )
                .join("")}
            </div>
          </section>`;
      }

      function renderJourney(journey) {
        const stages = journey.stages
          .map(
            (stage, index) => `
            ${index > 0 ? `<div class="link" style="--delay:${index * 0.26}s"></div>` : ""}
            <div class="stage" style="animation-delay:${index * 90}ms">
              <div class="num">STEP ${index + 1}</div>
              <div class="name">${esc(stage.name)}</div>
              <div class="desc">${esc(stage.desc)}</div>
              <div class="who">${highlight(stage.who)}</div>
            </div>`,
          )
          .join("");

        return `
          <div class="flow-head vrule">
            <div class="flow-title">${esc(journey.say)}</div>
            <div class="flow-goal">${esc(journey.goal)}</div>
          </div>
          <div class="flow-scroll"><div class="flow-track">${stages}</div></div>
          <p class="scroll-note">→ 向右捲動看完整流程</p>
          <div class="flow-io">
            <div class="io vrule quiet">
              <div class="lbl">你要準備</div>
              <ul>${journey.give.map((g) => `<li>${esc(g)}</li>`).join("")}</ul>
            </div>
            <div class="io vrule quiet">
              <div class="lbl">你會拿到</div>
              <ul>${journey.get.map((g) => `<li>${esc(g)}</li>`).join("")}</ul>
            </div>
          </div>`;
      }

      function renderJourneySection() {
        return `
          <section class="section reveal" id="journey">
            <div class="section-head vrule">
              <div class="kicker">Step 02</div>
              <h2>這條路要走幾步</h2>
              <p class="sub">左到右就是時間順序。每一格底下標的是負責那一步的 skill；標「你自己看」「你決定」的那幾格，是需要你判斷、AI 不該替你決定的地方。</p>
            </div>
            <div id="journey-slot"></div>
          </section>`;
      }

      function renderMatcher() {
        return `
          <section class="section reveal" id="matcher">
            <div class="section-head vrule">
              <div class="kicker">Step 03</div>
              <h2>「做出來跟設計稿不一樣」該怎麼講</h2>
              <p class="sub">這是最常遇到的情況，也是最容易講不清楚的。選一下你手上有什麼、要修哪一邊，下面會生出可以直接複製的一句話。</p>
            </div>
            <div class="matcher">
              <div>
                <div class="picker-group">
                  <div class="lbl">誰是標準</div>
                  <div class="opts" id="opt-source">
                    ${matcher.sources
                      .map(
                        (s, i) => `
                      <button class="opt" type="button" data-source="${s.id}" aria-pressed="${i === 0}">
                        <span class="mark" aria-hidden="true"></span><span>${esc(s.label)}</span>
                      </button>`,
                      )
                      .join("")}
                  </div>
                </div>
                <div class="picker-group">
                  <div class="lbl">要修哪一邊</div>
                  <div class="opts" id="opt-target">
                    ${matcher.targets
                      .map(
                        (t, i) => `
                      <button class="opt" type="button" data-target="${t.id}" aria-pressed="${i === 0}">
                        <span class="mark" aria-hidden="true"></span><span>${esc(t.label)}</span>
                      </button>`,
                      )
                      .join("")}
                  </div>
                </div>
              </div>
              <div class="result" id="matcher-result"></div>
            </div>
          </section>`;
      }

      function renderMatcherResult(sourceId, targetId) {
        const key = `${sourceId}|${targetId}`;
        const source = matcher.sources.find((s) => s.id === sourceId);
        const target = matcher.targets.find((t) => t.id === targetId);
        const info = matcher.cases[key] || {
          say: `拿${source.label}當標準去修${target.label.split("（")[0]}`,
          note: "兩邊都會先讀成同一份規格再比對，並區分出該修的落差與該保留的平台差異。",
        };
        const example = matcher.examples[key];

        return `
          <div class="verdict swap vrule">
            <div class="say">${esc(info.say)}</div>
            <div class="note">${esc(info.note)}</div>
          </div>
          <div class="chain">
            <span class="chain-node">${esc(source.label)}</span>
            <span class="chain-arrow">→</span>
            <span class="chain-node">抽成同一份規格</span>
            <span class="chain-arrow">→</span>
            <span class="chain-node">分出該修／該留</span>
            <span class="chain-arrow">→</span>
            <span class="chain-node end">${esc(target.label.split("（")[0])}</span>
          </div>
          <div>
            <div class="lbl">直接複製這句</div>
            ${codeBlock(example)}
          </div>
          <div class="verdict vrule quiet">
            <div class="note">想先看報告不要動程式碼，就把 $ui-compare-to-reference 換成 $ui-pixel-align-report。${esc(source.note)}</div>
          </div>`;
      }

      function renderSkills() {
        const groups = [...new Set(skills.map((s) => s.group))];
        return `
          <section class="section reveal" id="skills">
            <div class="section-head vrule">
              <div class="kicker">Step 04</div>
              <h2>13 個 skill，分成四類</h2>
              <p class="sub">點一張卡看細節：你要給它什麼、它會回你什麼。不用背名字，用上面的旅程地圖找就好。</p>
            </div>
            <div class="skill-filter" id="skill-filter">
              <button class="chip" type="button" data-group="all" aria-pressed="true">全部</button>
              ${groups.map((g) => `<button class="chip" type="button" data-group="${esc(g)}" aria-pressed="false">${esc(g)}</button>`).join("")}
            </div>
            <div class="skill-grid" id="skill-grid">
              ${skills
                .map(
                  (skill) => `
                <article class="skill" data-group="${esc(skill.group)}">
                  <button class="skill-top" type="button" aria-expanded="false">
                    <span class="skill-when">${esc(skill.when)}</span>
                    <span class="skill-tag">${esc(skill.tag)}${skill.external ? ' <span class="skill-note-tag">· 需另外安裝</span>' : ""}</span>
                  </button>
                  <div class="skill-body"><div><div class="skill-inner">
                    <div class="kv"><div class="k">你給</div><div class="v">${esc(skill.give)}</div></div>
                    <div class="kv"><div class="k">你拿到</div><div class="v">${esc(skill.get)}</div></div>
                    <div class="kv"><div class="k">要知道</div><div class="v">${esc(skill.note)}</div></div>
                  </div></div></div>
                </article>`,
                )
                .join("")}
            </div>
          </section>`;
      }

      function renderPrompts() {
        return `
          <section class="section reveal" id="prompts">
            <div class="section-head vrule">
              <div class="kicker">Step 05</div>
              <h2>怎麼跟 AI 開口</h2>
              <p class="sub">照抄下面任何一句，把路徑換成你自己的就行。如果 AI 說不認得這個名字，就請它先讀那個資料夾裡的 SKILL.md 再照做。</p>
            </div>
            <div class="prompt-list">${prompts.map((p) => codeBlock(p)).join("")}</div>
            <div class="rule vrule" style="margin-top:26px">
              <h3>唯一一條原則：不要跳過設計系統那層</h3>
              <p>有 token 或共用元件就先用它、先改它，再處理單一畫面。跳過這層當下會快一點，但之後每個畫面都會愈長愈不一樣，最後誰都不敢改。</p>
            </div>
          </section>`;
      }

      function renderOutputs() {
        return `
          <section class="section reveal" id="outputs">
            <div class="section-head vrule">
              <div class="kicker">Step 06</div>
              <h2>做完會留下什麼</h2>
              <p class="sub">這些檔案會留在專案裡，不會只存在對話紀錄。報告類的產出都是靜態檔案，直接用瀏覽器開就能看。</p>
            </div>
            <div class="out-grid">
              ${outputs
                .map(
                  (out) => `
                <div class="out vrule quiet">
                  <h3>${esc(out.title)}</h3>
                  <p class="hint">${esc(out.hint)}</p>
                  <div class="files">${out.files.map((f) => `<div class="file">${esc(f)}</div>`).join("")}</div>
                </div>`,
                )
                .join("")}
            </div>
            <footer>
              這頁是入口。每個 skill 的完整規則、參數與邊界條件，以各自資料夾裡的 SKILL.md 為準 —
              <a href="${REPO_URL}" target="_blank" rel="noopener">github.com/harrychuang-cm/skills</a>
            </footer>
          </section>`;
      }

      /* ================================================================ boot */

      document.getElementById("side-nav").innerHTML = renderNav();
      document.getElementById("skill-count").textContent = `${skills.length} skills`;
      document.getElementById("canvas").innerHTML = [
        renderHero(),
        renderSituations(),
        renderJourneySection(),
        renderMatcher(),
        renderSkills(),
        renderPrompts(),
        renderOutputs(),
      ].join("");

      /* --------------------------------------------------- situation → flow */

      const journeySlot = document.getElementById("journey-slot");

      function wireScrollHint() {
        const scroller = journeySlot.querySelector(".flow-scroll");
        const note = journeySlot.querySelector(".scroll-note");
        if (!scroller || !note) return;
        const update = () => {
          const more = scroller.scrollWidth - scroller.clientWidth - scroller.scrollLeft > 8;
          note.classList.toggle("show", more);
        };
        scroller.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", update, { passive: true });
        update();
      }

      function selectJourney(id, scroll) {
        const journey = journeys.find((j) => j.id === id) || journeys[0];
        document.querySelectorAll("[data-journey]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.journey === journey.id));
        });
        journeySlot.innerHTML = renderJourney(journey);
        wireScrollHint();
        if (scroll) {
          document.getElementById("journey").scrollIntoView({ behavior: "smooth", block: "start" });
        }
      }

      document.getElementById("situations").addEventListener("click", (event) => {
        const button = event.target.closest("[data-journey]");
        if (button) selectJourney(button.dataset.journey, true);
      });

      selectJourney("from-design", false);

      /* ------------------------------------------------------------ matcher */

      const matcherState = { source: "figma", target: "web" };
      const matcherResult = document.getElementById("matcher-result");

      function paintMatcher() {
        matcherResult.innerHTML = renderMatcherResult(matcherState.source, matcherState.target);
      }

      document.getElementById("opt-source").addEventListener("click", (event) => {
        const button = event.target.closest("[data-source]");
        if (!button) return;
        matcherState.source = button.dataset.source;
        document.querySelectorAll("[data-source]").forEach((other) => {
          other.setAttribute("aria-pressed", String(other === button));
        });
        paintMatcher();
      });

      document.getElementById("opt-target").addEventListener("click", (event) => {
        const button = event.target.closest("[data-target]");
        if (!button) return;
        matcherState.target = button.dataset.target;
        document.querySelectorAll("[data-target]").forEach((other) => {
          other.setAttribute("aria-pressed", String(other === button));
        });
        paintMatcher();
      });

      paintMatcher();

      /* ------------------------------------------------------------- skills */

      document.getElementById("skill-grid").addEventListener("click", (event) => {
        const top = event.target.closest(".skill-top");
        if (!top) return;
        const card = top.closest(".skill");
        const open = card.classList.toggle("open");
        top.setAttribute("aria-expanded", String(open));
      });

      document.getElementById("skill-filter").addEventListener("click", (event) => {
        const chip = event.target.closest("[data-group]");
        if (!chip) return;
        const group = chip.dataset.group;
        document.querySelectorAll("#skill-filter [data-group]").forEach((other) => {
          other.setAttribute("aria-pressed", String(other === chip));
        });
        document.querySelectorAll("#skill-grid .skill").forEach((card) => {
          card.classList.toggle("hide", group !== "all" && card.dataset.group !== group);
        });
      });

      /* --------------------------------------------------------------- copy */

      document.addEventListener("click", async (event) => {
        const button = event.target.closest("[data-copy]");
        if (!button) return;
        try {
          await navigator.clipboard.writeText(button.dataset.copy);
        } catch {
          const area = document.createElement("textarea");
          area.value = button.dataset.copy;
          document.body.appendChild(area);
          area.select();
          document.execCommand("copy");
          area.remove();
        }
        button.classList.add("done");
        setTimeout(() => button.classList.remove("done"), 1400);
      });

      /* ------------------------------------------------- reveal + nav state */

      const revealer = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              entry.target.classList.add("seen");
              revealer.unobserve(entry.target);
            }
          });
        },
        { rootMargin: "0px 0px -12% 0px" },
      );

      document.querySelectorAll(".reveal").forEach((node) => revealer.observe(node));

      const navLinks = [...document.querySelectorAll("#side-nav a")];
      const spy = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            if (!entry.isIntersecting) return;
            navLinks.forEach((link) => {
              link.classList.toggle("active", link.getAttribute("href") === `#${entry.target.id}`);
            });
          });
        },
        { rootMargin: "-20% 0px -70% 0px" },
      );

      document.querySelectorAll(".section[id]").forEach((node) => spy.observe(node));
    </script>
  </body>
</html>
