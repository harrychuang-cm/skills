<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CM Skills Guide</title>
    <style>
      :root {
        --bg: #f7f7f4;
        --surface: #ffffff;
        --surface-soft: #f0f3ee;
        --text: #1e2522;
        --muted: #5f6c66;
        --line: #d8ded8;
        --accent: #246b5a;
        --accent-strong: #16483d;
        --accent-soft: #dcebe5;
        --warn: #8a5a18;
        --warn-soft: #f5ead8;
        --code: #24302c;
        --shadow: 0 16px 40px rgba(32, 45, 39, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        line-height: 1.65;
      }

      a {
        color: var(--accent-strong);
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
      }

      .page {
        max-width: 1120px;
        margin: 0 auto;
        padding: 30px 24px 64px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding: 0 0 18px;
      }

      .language-switcher {
        display: inline-flex;
        gap: 4px;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
      }

      .language-switcher button {
        min-width: 52px;
        border: 0;
        border-radius: 6px;
        padding: 7px 10px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        font-weight: 700;
      }

      .language-switcher button[aria-pressed="true"] {
        background: var(--accent);
        color: #ffffff;
      }

      header {
        padding: 18px 0 28px;
        border-bottom: 1px solid var(--line);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3 {
        margin: 0;
        line-height: 1.2;
        letter-spacing: 0;
      }

      h1 {
        max-width: 790px;
        font-size: 56px;
      }

      h2 {
        margin-bottom: 16px;
        font-size: 28px;
      }

      h3 {
        font-size: 20px;
      }

      p {
        margin: 0;
      }

      code {
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 0.95em;
      }

      .lead {
        max-width: 800px;
        margin-top: 18px;
        color: var(--muted);
        font-size: 18px;
      }

      .section {
        padding: 34px 0;
        border-bottom: 1px solid var(--line);
      }

      .grid {
        display: grid;
        gap: 18px;
      }

      .grid.two {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .grid.four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .panel,
      .skill,
      .step,
      .prompt {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .panel {
        padding: 22px;
      }

      .skill {
        display: flex;
        min-height: 100%;
        flex-direction: column;
        gap: 16px;
        padding: 20px;
      }

      .skill .tag,
      .step .number {
        display: inline-flex;
        width: fit-content;
        align-items: center;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
      }

      .skill .tag {
        padding: 3px 8px;
        background: var(--accent-soft);
        color: var(--accent-strong);
      }

      .skill p,
      .step p,
      .panel p {
        color: var(--muted);
      }

      .skill ul,
      .panel ul {
        margin: 0;
        padding-left: 20px;
        color: var(--muted);
      }

      .step {
        padding: 18px;
      }

      .step .number {
        margin-bottom: 10px;
        padding: 2px 7px;
        background: var(--surface-soft);
        color: var(--accent-strong);
      }

      .flow {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .prompt-list {
        display: grid;
        gap: 12px;
      }

      .prompt {
        padding: 14px 16px;
        overflow: auto;
        background: var(--code);
        color: #f5fbf8;
        font-family:
          "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
        font-size: 13px;
        line-height: 1.55;
        white-space: pre-wrap;
      }

      .notice {
        border-color: #ead7b5;
        background: var(--warn-soft);
      }

      .notice strong {
        color: var(--warn);
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }

      .pill {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 11px;
        background: var(--surface);
        color: var(--muted);
        font-size: 13px;
      }

      footer {
        padding-top: 28px;
        color: var(--muted);
        font-size: 14px;
      }

      @media (max-width: 860px) {
        .grid.two,
        .grid.four,
        .flow {
          grid-template-columns: 1fr;
        }

        .page {
          padding: 20px 18px 44px;
        }

        .topbar {
          justify-content: flex-start;
        }

        header {
          padding-top: 14px;
        }

        h1 {
          font-size: 38px;
        }
      }
    </style>
  </head>

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function detectLanguage() {
        const stored = window.localStorage.getItem("cm-skills-language");
        if (stored && copy[stored]) return stored;
        const languages = navigator.languages?.length
          ? navigator.languages
          : [navigator.language || "en"];
        for (const language of languages) {
          const normalized = language.toLowerCase();
          if (normalized.startsWith("ja") || normalized.startsWith("jp")) return "ja";
          if (normalized.startsWith("zh")) return "zh-Hant";
          if (normalized.startsWith("en")) return "en";
        }
        return "en";
      }

      function renderList(items, code = false) {
        return `<ul>${items
          .map((item) => `<li>${code ? `<code>${escapeHtml(item)}</code>` : escapeHtml(item)}</li>`)
          .join("")}</ul>`;
      }

      function renderSkillCards(lang) {
        return skillData
          .map((skill) => {
            const localized = copy[lang].skills[skill.key];
            return `
              <article class="skill">
                <span class="tag">${escapeHtml(skill.tag)}</span>
                <h3>${escapeHtml(localized.title)}</h3>
                <p>${escapeHtml(localized.body)}</p>
                ${renderList(skill.bullets[lang])}
              </article>
            `;
          })
          .join("");
      }

      function renderFlow(lang) {
        return copy[lang].flow
          .map(
            (item, index) => `
              <article class="step">
                <span class="number">${String(index + 1).padStart(2, "0")}</span>
                <h3>${escapeHtml(item.title)}</h3>
                <p>${escapeHtml(item.body)}</p>
              </article>
            `,
          )
          .join("");
      }

      function renderPrompts(lang) {
        return copy[lang].prompts
          .map((prompt) => `<pre class="prompt">${escapeHtml(prompt)}</pre>`)
          .join("");
      }

      function render(lang) {
        const text = copy[lang];
        document.documentElement.lang = lang;
        document.title = text.title;
        document.querySelectorAll("[data-lang]").forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.lang === lang));
        });
        document.getElementById("content").innerHTML = `
          <header>
            <p class="eyebrow">${escapeHtml(text.eyebrow)}</p>
            <h1>${escapeHtml(text.title)}</h1>
            <p class="lead">${escapeHtml(text.lead)}</p>
            <div class="meta" aria-label="Highlights">
              ${text.pills.map((pill) => `<span class="pill">${escapeHtml(pill)}</span>`).join("")}
            </div>
          </header>

          <section class="section" aria-labelledby="quick-choice">
            <h2 id="quick-choice">${escapeHtml(text.quickChoice)}</h2>
            <div class="grid four">${renderSkillCards(lang)}</div>
          </section>

          <section class="section" aria-labelledby="recommended-flow">
            <h2 id="recommended-flow">${escapeHtml(text.recommendedFlow)}</h2>
            <div class="flow">${renderFlow(lang)}</div>
          </section>

          <section class="section" aria-labelledby="examples">
            <h2 id="examples">${escapeHtml(text.examples)}</h2>
            <div class="grid two">
              <div class="prompt-list" aria-label="Prompt examples">
                ${renderPrompts(lang)}
              </div>
              <aside class="panel notice">
                <h3>${escapeHtml(text.principleTitle)}</h3>
                <p><strong>${escapeHtml(text.principleStrong)}</strong> ${escapeHtml(text.principleBody)}</p>
              </aside>
            </div>
          </section>

          <section class="section" aria-labelledby="outputs">
            <h2 id="outputs">${escapeHtml(text.outputs)}</h2>
            <div class="grid two">
              <article class="panel">
                <h3>${escapeHtml(text.extractOutputTitle)}</h3>
                ${renderList(text.extractOutputs, true)}
              </article>
              <article class="panel">
                <h3>${escapeHtml(text.storybookOutputTitle)}</h3>
                ${renderList(text.storybookOutputs)}
              </article>
            </div>
          </section>

          <footer>
            <p>${escapeHtml(text.footer)}</p>
          </footer>
        `;
      }

      document.querySelectorAll("[data-lang]").forEach((button) => {
        button.addEventListener("click", () => {
          const lang = button.dataset.lang;
          window.localStorage.setItem("cm-skills-language", lang);
          render(lang);
        });
      });

      render(detectLanguage());
    </script>
  </body>
</html>
