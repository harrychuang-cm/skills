<main class="app">
  <header class="header">
    <div class="brand">
      <span aria-hidden="true" class="brand-mark">S</span>
      <div class="brand-copy">
        <h1>Import Storybook JSON</h1>
        <p>Paste an export payload into Figma</p>
      </div>
    </div>
    <span style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end;">
      <span class="badge">v1/v2 JSON</span>
      <span class="badge" id="plugin-version" title="Plugin build version">build 1.1.8</span>
    </span>
  </header>

  <section class="file-import" id="file-drop-zone" tabindex="0">
    <span aria-hidden="true" class="file-import-icon">JSON</span>
    <span class="file-import-copy">
      <strong>Import from file</strong>
      <span id="file-name">Choose or drop a .sbfx.json export file.</span>
    </span>
    <label class="file-import-action" for="file-input">Choose file</label>
    <input
      id="file-input"
      accept=".json,.sbfx.json,application/json"
      class="file-input"
      type="file"
    />
  </section>

  <section class="bridge" id="bridge">
    <span class="field-header">
      <span>Load from Storybook</span>
      <span class="field-hint">Local bridge</span>
    </span>
    <div class="bridge-controls">
      <input
        id="bridge-url"
        type="text"
        value="http://localhost:6006"
        spellcheck="false"
        aria-label="Storybook URL"
      />
      <button id="bridge-fetch" class="secondary" type="button">Fetch</button>
    </div>
    <div class="bridge-list" id="bridge-list" hidden></div>
    <div class="bridge-actions" id="bridge-actions" hidden>
      <label class="bridge-select-all">
        <input type="checkbox" id="bridge-select-all" />
        Select all
      </label>
      <button id="bridge-import" type="button">Import selected</button>
    </div>
  </section>

  <label class="field">
    <span class="field-header">
      <span>Storybook export JSON</span>
      <span class="field-hint">Required</span>
    </span>
    <textarea
      id="payload"
      placeholder='{"version":2,"artifactKind":"component","storyId":"components-switch--all-variants","tokens":[...],"root":{...}}'
      spellcheck="false"
    ></textarea>
  </label>

  <section aria-live="polite" class="status" id="status">
    <span aria-hidden="true" class="status-dot"></span>
    <span class="status-copy">
      <strong id="status-title">Ready</strong>
      <span id="status-body">Waiting for Storybook export JSON.</span>
    </span>
    <pre id="status-detail"></pre>
  </section>

  <div class="actions">
    <button id="import" type="button">Import to Figma</button>
    <button id="cancel" class="secondary" type="button">Cancel</button>
  </div>
</main>

<style>

    --sctd-bg: #f7f8fc;
    --sctd-border: #d9def0;
    --sctd-border-strong: #b8c1e4;

  .bridge-select-all {

    align-items: center;
    gap: 6px;
    color: var(--figma-color-text-secondary, var(--sctd-muted));
    font-size: 11px;
    font-weight: 600;

  .field-hint {

    font-weight: 600;
    letter-spacing: 0.02em;

  textarea {
    height: 100%;

    position: fixed;
    z-index: 10;
    right: 0;
    bottom: 0;
    left: 0;
    justify-content: flex-end;
    flex-wrap: wrap;
    min-width: 0;
    width: min(100vw, 440px);
    margin: 0 auto;
    padding: 12px 16px 16px;

    font-size: 12px;
    line-height: 17px;
  }

  .status[data-state="importing"] .status-dot {

    box-shadow: 0 0 0 4px rgba(119, 98, 255, 0.12);

    grid-column: 2;
    overflow: auto;
    max-height: 88px;
    margin: 4px 0 0;
    color: var(--figma-color-text-secondary, var(--sctd-muted));
    font: 10.5px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

</style>

<script>
  const payload = document.getElementById("payload");
  const fileInput = document.getElementById("file-input");
  const fileDropZone = document.getElementById("file-drop-zone");
  const fileName = document.getElementById("file-name");
  const importButton = document.getElementById("import");
  const cancelButton = document.getElementById("cancel");
  const statusBox = document.getElementById("status");
  const statusTitle = document.getElementById("status-title");
  const statusBody = document.getElementById("status-body");
  const statusDetail = document.getElementById("status-detail");

  function setStatus(state, title, body, detail) {
    statusBox.dataset.state = state;
    statusTitle.textContent = title;
    statusBody.textContent = body || "";
    statusDetail.textContent = detail || "";
  }

  function setImporting(importing) {
    importButton.disabled = importing;
    fileInput.disabled = importing;
    fileDropZone.dataset.disabled = importing ? "true" : "false";
    importButton.textContent = importing ? "Importing..." : "Import to Figma";
    if (!importing) {
      syncImportButton();
    }
  }

  function syncImportButton() {
    importButton.disabled = payload.value.trim().length === 0;
  }

  payload.addEventListener("input", syncImportButton);
  syncImportButton();

  function formatFileSize(bytes) {
    if (!Number.isFinite(bytes) || bytes <= 0) return "0 B";
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
  }

  function isJsonExportFile(file) {
    return (
      file.name.toLowerCase().endsWith(".json") ||
      file.name.toLowerCase().endsWith(".sbfx.json") ||
      file.type === "application/json"
    );
  }

  async function loadExportFile(file) {
    if (!file) return;

    if (!isJsonExportFile(file)) {
      setStatus(
        "error",
        "Unsupported file",
        "Choose a .json or .sbfx.json Storybook export file.",
      );
      return;
    }

    try {
      const text = await file.text();
      JSON.parse(text);
      payload.value = text.trim();
      syncImportButton();
      fileName.textContent = `${file.name} (${formatFileSize(file.size)})`;
      setStatus(
        "ready",
        "File loaded",
        "Review the JSON or import it directly into Figma.",
      );
    } catch (error) {
      setStatus(
        "error",
        "Invalid JSON file",
        error instanceof Error ? error.message : "Unable to read the selected file.",
      );
    }
  }

  fileInput.addEventListener("change", () => {
    loadExportFile(fileInput.files && fileInput.files[0]);
    fileInput.value = "";
  });

  fileDropZone.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      fileInput.click();
    }
  });

  fileDropZone.addEventListener("dragover", (event) => {
    event.preventDefault();
    if (!fileInput.disabled) {
      fileDropZone.dataset.dragging = "true";
    }
  });

  fileDropZone.addEventListener("dragleave", () => {
    delete fileDropZone.dataset.dragging;
  });

  fileDropZone.addEventListener("drop", (event) => {
    event.preventDefault();
    delete fileDropZone.dataset.dragging;
    if (fileInput.disabled) return;
    loadExportFile(event.dataTransfer.files && event.dataTransfer.files[0]);
  });

  importButton.onclick = () => {
    const json = payload.value.trim();
    if (!json) {
      setStatus("error", "Missing JSON", "Paste the Storybook Copy JSON output before importing.");
      return;
    }

    setImporting(true);
    setStatus("importing", "Importing", "Parsing JSON and creating Figma layers.");
    parent.postMessage({ pluginMessage: { type: "import-json", json } }, "*");
  };

  // sbfx-bridge-helpers-start
  // Pure helpers for the local Storybook bridge; kept fetch-free so
  // test/verify-bridge-helpers.cjs can evaluate them under Node.
  function buildBridgePayloadListUrl(baseUrl) {
    const trimmed = String(baseUrl || "").trim().replace(/\/+$/, "");
    if (!/^https?:\/\//i.test(trimmed)) return null;
    return trimmed + "/__figma-export/payloads";
  }

  function buildBridgePayloadUrl(baseUrl, storyId) {
    const listUrl = buildBridgePayloadListUrl(baseUrl);
    if (!listUrl || !storyId) return null;
    return listUrl + "/" + encodeURIComponent(String(storyId));
  }

  function parseBridgePayloadList(data) {
    if (!Array.isArray(data)) {
      throw new Error("Bridge list response must be a JSON array.");
    }
    return data
      .filter(
        (entry) =>
          entry &&
          typeof entry === "object" &&
          typeof entry.storyId === "string" &&
          entry.storyId.length > 0,
      )
      .map((entry) => ({
        componentTitle:
          typeof entry.componentTitle === "string" ? entry.componentTitle : "",
        generatedAt: typeof entry.generatedAt === "string" ? entry.generatedAt : "",
        storyId: entry.storyId,
        storyName: typeof entry.storyName === "string" ? entry.storyName : "",
      }));
  }
  // sbfx-bridge-helpers-end

  const bridgeUrlInput = document.getElementById("bridge-url");
  const bridgeFetchButton = document.getElementById("bridge-fetch");
  const bridgeList = document.getElementById("bridge-list");
  const bridgeActions = document.getElementById("bridge-actions");
  const bridgeSelectAll = document.getElementById("bridge-select-all");
  const bridgeImportButton = document.getElementById("bridge-import");

  let bridgeQueue = [];
  let bridgeTotal = 0;
  let bridgeFailed = [];
  let bridgeActive = false;

  function renderBridgeList(entries) {
    bridgeList.innerHTML = "";
    for (const entry of entries) {
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = entry.storyId;
      checkbox.className = "bridge-item";
      const name = document.createElement("span");
      name.textContent = entry.componentTitle
        ? entry.componentTitle + " / " + entry.storyName
        : entry.storyId;
      const meta = document.createElement("span");
      meta.className = "bridge-item-meta";
      meta.textContent = entry.storyId;
      label.append(checkbox, name, meta);
      bridgeList.append(label);
    }
    const hasEntries = entries.length > 0;
    bridgeList.hidden = !hasEntries;
    bridgeActions.hidden = !hasEntries;
    bridgeSelectAll.checked = false;
  }

  bridgeSelectAll.addEventListener("change", () => {
    for (const checkbox of bridgeList.querySelectorAll("input.bridge-item")) {
      checkbox.checked = bridgeSelectAll.checked;
    }
  });

  bridgeFetchButton.onclick = async () => {
    const listUrl = buildBridgePayloadListUrl(bridgeUrlInput.value);
    if (!listUrl) {
      setStatus("error", "Invalid Storybook URL", "Use an http(s) URL such as http://localhost:6006.");
      return;
    }

    bridgeFetchButton.disabled = true;
    setStatus("importing", "Fetching", "Reading stored payloads from " + listUrl + "...");
    try {
      const response = await fetch(listUrl);
      if (!response.ok) {
        throw new Error("Bridge answered " + response.status + ".");
      }
      const entries = parseBridgePayloadList(await response.json());
      renderBridgeList(entries);
      setStatus(
        entries.length > 0 ? "ready" : "error",
        entries.length > 0 ? "Bridge connected" : "No payloads stored",
        entries.length > 0
          ? entries.length + " stored payload(s). Select and import."
          : "Export stories in Storybook first (the overlay stores payloads when payloadSyncUrl is configured).",
      );
    } catch (error) {
      renderBridgeList([]);
      setStatus(
        "error",
        "Bridge unreachable",
        (error instanceof Error ? error.message : String(error)) +
          " Check that Storybook is running and the plugin manifest allows localhost. Pasting JSON still works.",
      );
    } finally {
      bridgeFetchButton.disabled = false;
    }
  };

  async function importNextFromBridge() {
    if (bridgeQueue.length === 0) {
      bridgeActive = false;
      const doneCount = bridgeTotal - bridgeFailed.length;
      setImporting(false);
      setStatus(
        bridgeFailed.length > 0 ? "error" : "complete",
        "Batch import finished",
        doneCount + "/" + bridgeTotal + " payload(s) imported.",
        bridgeFailed.length > 0 ? "Failed: " + bridgeFailed.join(", ") : "",
      );
      return;
    }

    const storyId = bridgeQueue.shift();
    const position = bridgeTotal - bridgeQueue.length;
    const payloadUrl = buildBridgePayloadUrl(bridgeUrlInput.value, storyId);
    setImporting(true);
    setStatus(
      "importing",
      "Importing " + position + "/" + bridgeTotal,
      storyId,
    );

    try {
      const response = await fetch(payloadUrl);
      if (!response.ok) {
        throw new Error("Bridge answered " + response.status + " for " + storyId + ".");
      }
      const json = (await response.text()).trim();
      parent.postMessage({ pluginMessage: { type: "import-json", json } }, "*");
    } catch (error) {
      bridgeFailed.push(storyId);
      importNextFromBridge();
    }
  }

  bridgeImportButton.onclick = () => {
    const selected = Array.from(
      bridgeList.querySelectorAll("input.bridge-item:checked"),
    ).map((checkbox) => checkbox.value);
    if (selected.length === 0) {
      setStatus("error", "Nothing selected", "Tick at least one stored payload first.");
      return;
    }

    bridgeQueue = selected;
    bridgeTotal = selected.length;
    bridgeFailed = [];
    bridgeActive = true;
    importNextFromBridge();
  };

  cancelButton.onclick = () => {
    parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
  };

  window.onmessage = (event) => {
    const message = event.data.pluginMessage;
    if (!message) return;

    if (message.type === "plugin-version") {
      document.getElementById("plugin-version").textContent = `build ${message.version}`;
      return;
    }

    if (message.type === "import-status") {
      setImporting(true);
      setStatus("importing", "Importing", "Upserting variables and creating nodes.");
      return;
    }

    if (message.type === "import-complete") {
      const stats = message.stats;
      const warningCount = stats.warnings.length;
      const componentSummary = stats.componentsCreated || stats.reusedComponents
        ? ` ${stats.componentsCreated} components created, ${stats.reusedComponents} reused.`
        : "";
      const rootSummary = stats.rootType
        ? ` Root: ${stats.rootType}${stats.rootName ? ` (${stats.rootName})` : ""}.`
        : "";
      const importSummary = stats.artifactKind
        ? ` Artifact: ${stats.artifactKind}${stats.importedAsComponent ? " component import" : ""}.`
        : "";
      const summary = `${stats.nodesCreated} nodes created.${componentSummary} ${stats.variablesCreated} variables created, ${stats.reusedVariables} reused.${rootSummary}${importSummary}`;
      const detail = warningCount
        ? `${warningCount} warnings:\n${stats.warnings.slice(0, 12).join("\n")}`
        : "No warnings.";
      if (bridgeActive) {
        importNextFromBridge();
        return;
      }
      setImporting(false);
      setStatus("complete", "Import complete", summary, detail);
      return;
    }

    if (message.type === "import-error") {
      if (bridgeActive) {
        bridgeFailed.push(bridgeTotal - bridgeQueue.length + ": " + message.message);
        importNextFromBridge();
        return;
      }
      setImporting(false);
      setStatus("error", "Import failed", message.message);
    }
  };
</script>
