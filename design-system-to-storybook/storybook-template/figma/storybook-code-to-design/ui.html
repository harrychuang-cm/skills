<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 12px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-block-size: 100vh;
        margin: 0;
        color: var(--figma-color-text);
        background: var(--figma-color-bg);
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
      }

      h1,
      h2,
      p,
      dl,
      dd {
        margin: 0;
      }

      .app {
        display: grid;
        grid-template-rows: auto 1fr auto;
        min-block-size: 100vh;
      }

      .header {
        display: grid;
        gap: 8px;
        padding: 16px 16px 12px;
        border-block-end: 1px solid var(--figma-color-border);
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        color: var(--figma-color-text);
        font-size: 16px;
        font-weight: 700;
        line-height: 22px;
      }

      .badge {
        flex: 0 0 auto;
        padding: 2px 7px;
        color: var(--figma-color-text-brand);
        background: var(--figma-color-bg-brand-tertiary);
        border: 1px solid var(--figma-color-border-brand);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        line-height: 16px;
      }

      .subtitle {
        color: var(--figma-color-text-secondary);
        font-size: 12px;
        line-height: 18px;
      }

      .content {
        display: grid;
        align-content: start;
        gap: 12px;
        padding: 12px 16px;
        overflow: auto;
      }

      .drop-zone {
        display: grid;
        gap: 10px;
        min-block-size: 116px;
        padding: 14px;
        color: var(--figma-color-text);
        background: var(--figma-color-bg-secondary);
        border: 1px dashed var(--figma-color-border);
        border-radius: 8px;
        cursor: pointer;
      }

      .drop-zone[data-state="active"] {
        background: var(--figma-color-bg-selected);
        border-color: var(--figma-color-border-selected);
      }

      .drop-zone[data-state="ready"] {
        background: var(--figma-color-bg-success-tertiary);
        border-color: var(--figma-color-border-success);
      }

      .drop-zone[data-state="error"] {
        background: var(--figma-color-bg-danger-tertiary);
        border-color: var(--figma-color-border-danger);
      }

      .drop-zone:focus-within {
        outline: 2px solid var(--figma-color-border-selected);
        outline-offset: 2px;
      }

      .file-input {
        position: absolute;
        inline-size: 1px;
        block-size: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .drop-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .drop-icon {
        display: grid;
        place-items: center;
        inline-size: 34px;
        block-size: 34px;
        color: var(--figma-color-icon-brand);
        background: var(--figma-color-bg);
        border: 1px solid var(--figma-color-border);
        border-radius: 8px;
      }

      .drop-copy {
        display: grid;
        gap: 2px;
        min-inline-size: 0;
      }

      .drop-title {
        overflow: hidden;
        color: var(--figma-color-text);
        font-size: 13px;
        font-weight: 700;
        line-height: 18px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .drop-meta {
        overflow: hidden;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
        line-height: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .file-actions {
        display: flex;
        gap: 8px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-block-size: 32px;
        padding: 7px 11px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        line-height: 16px;
        cursor: pointer;
      }

      .button:focus-visible {
        outline: 2px solid var(--figma-color-border-selected);
        outline-offset: 2px;
      }

      .button-primary {
        flex: 1 1 auto;
        color: var(--figma-color-text-onbrand);
        background: var(--figma-color-bg-brand);
      }

      .button-primary:hover:not(:disabled) {
        background: var(--figma-color-bg-brand-hover);
      }

      .button-primary:active:not(:disabled) {
        background: var(--figma-color-bg-brand-pressed);
      }

      .button-secondary {
        color: var(--figma-color-text);
        background: var(--figma-color-bg-secondary);
        border: 1px solid var(--figma-color-border);
      }

      .button-secondary:hover:not(:disabled) {
        background: var(--figma-color-bg-hover);
      }

      .button:disabled {
        color: var(--figma-color-text-disabled);
        background: var(--figma-color-bg-disabled);
        border-color: var(--figma-color-border-disabled);
        cursor: default;
      }

      .panel {
        display: grid;
        gap: 10px;
        padding: 12px;
        background: var(--figma-color-bg-secondary);
        border: 1px solid var(--figma-color-border);
        border-radius: 8px;
      }

      .panel[hidden] {
        display: none;
      }

      .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      h2 {
        color: var(--figma-color-text);
        font-size: 12px;
        font-weight: 700;
        line-height: 18px;
      }

      .artifact-kind {
        max-inline-size: 110px;
        overflow: hidden;
        padding: 2px 6px;
        color: var(--figma-color-text-secondary);
        background: var(--figma-color-bg);
        border: 1px solid var(--figma-color-border);
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        line-height: 16px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .metric {
        min-block-size: 54px;
        padding: 8px;
        background: var(--figma-color-bg);
        border: 1px solid var(--figma-color-border);
        border-radius: 6px;
      }

      .metric dt {
        overflow: hidden;
        color: var(--figma-color-text-secondary);
        font-size: 11px;
        font-weight: 600;
        line-height: 15px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .metric dd {
        overflow: hidden;
        color: var(--figma-color-text);
        font-size: 13px;
        font-weight: 700;
        line-height: 20px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .steps {
        display: grid;
        gap: 8px;
      }

      .step {
        display: flex;
        align-items: center;
        gap: 8px;
        min-block-size: 22px;
        color: var(--figma-color-text-secondary);
        font-size: 12px;
        line-height: 18px;
      }

      .dot {
        inline-size: 8px;
        block-size: 8px;
        background: var(--figma-color-bg-disabled);
        border-radius: 999px;
      }

      .step[data-state="done"] {
        color: var(--figma-color-text-success);
      }

      .step[data-state="done"] .dot {
        background: var(--figma-color-bg-success);
      }

      .step[data-state="active"] {
        color: var(--figma-color-text-brand);
      }

      .step[data-state="active"] .dot {
        background: var(--figma-color-bg-brand);
      }

      .step[data-state="error"] {
        color: var(--figma-color-text-danger);
      }

      .step[data-state="error"] .dot {
        background: var(--figma-color-bg-danger);
      }

      .status {
        min-block-size: 58px;
        padding: 10px 12px;
        color: var(--figma-color-text-secondary);
        background: var(--figma-color-bg);
        border: 1px solid var(--figma-color-border);
        border-radius: 8px;
        font-size: 12px;
        line-height: 18px;
        white-space: pre-wrap;
      }

      .status[data-tone="info"] {
        color: var(--figma-color-text-secondary);
        border-color: var(--figma-color-border);
      }

      .status[data-tone="error"] {
        color: var(--figma-color-text-danger);
        background: var(--figma-color-bg-danger-tertiary);
        border-color: var(--figma-color-border-danger);
      }

      .status[data-tone="success"] {
        color: var(--figma-color-text-success);
        background: var(--figma-color-bg-success-tertiary);
        border-color: var(--figma-color-border-success);
      }

      .footer {
        display: flex;
        gap: 8px;
        padding: 12px 16px 16px;
        border-block-start: 1px solid var(--figma-color-border);
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div class="title-row">
          <h1>SBFX JSON Importer</h1>
          <span class="badge">v2</span>
        </div>
        <p class="subtitle">Storybook export payloads become editable Figma layers.</p>
      </header>

      <section class="content">
        <label class="drop-zone" id="dropZone">
          <input
            class="file-input"
            id="fileInput"
            accept=".json,.sbfx.json,application/json"
            type="file"
          />
          <span class="drop-head">
            <span class="drop-icon" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path
                  d="M9 3.25v7.5m0-7.5L5.75 6.5M9 3.25l3.25 3.25"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="1.5"
                />
                <path
                  d="M4 11.75v1.5c0 .83.67 1.5 1.5 1.5h7c.83 0 1.5-.67 1.5-1.5v-1.5"
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-width="1.5"
                />
              </svg>
            </span>
            <span class="drop-copy">
              <span class="drop-title" id="fileTitle">Select SBFX export</span>
              <span class="drop-meta" id="fileMeta">No file selected</span>
            </span>
          </span>
          <span class="file-actions">
            <span class="button button-secondary" aria-hidden="true">Choose file</span>
          </span>
        </label>

        <section class="panel" id="summaryPanel" hidden>
          <div class="panel-title">
            <h2>Payload</h2>
            <span class="artifact-kind" id="artifactKind">export</span>
          </div>
          <dl class="summary-grid" aria-label="Export summary">
            <div class="metric">
              <dt>Story</dt>
              <dd id="storyMetric">-</dd>
            </div>
            <div class="metric">
              <dt>Tokens</dt>
              <dd id="tokenMetric">-</dd>
            </div>
            <div class="metric">
              <dt>Nodes</dt>
              <dd id="nodeMetric">-</dd>
            </div>
            <div class="metric">
              <dt>Components</dt>
              <dd id="componentMetric">-</dd>
            </div>
          </dl>
        </section>

        <section class="panel" aria-label="Import state">
          <div class="steps">
            <div class="step" id="readStep">
              <span class="dot" aria-hidden="true"></span>
              <span>Read file</span>
            </div>
            <div class="step" id="validateStep">
              <span class="dot" aria-hidden="true"></span>
              <span>Validate payload</span>
            </div>
            <div class="step" id="importStep">
              <span class="dot" aria-hidden="true"></span>
              <span>Import layers</span>
            </div>
          </div>
          <div class="status" id="status" role="status" data-tone="info">Waiting for export file.</div>
        </section>
      </section>

      <footer class="footer">
        <button class="button button-secondary" id="clearButton" disabled type="button">Clear</button>
        <button class="button button-primary" id="importButton" disabled type="button">
          Import to Figma
        </button>
      </footer>
    </main>

    <script>
      const fileInput = document.getElementById("fileInput");
      const dropZone = document.getElementById("dropZone");
      const fileTitle = document.getElementById("fileTitle");
      const fileMeta = document.getElementById("fileMeta");
      const clearButton = document.getElementById("clearButton");
      const importButton = document.getElementById("importButton");
      const status = document.getElementById("status");
      const summaryPanel = document.getElementById("summaryPanel");
      const artifactKind = document.getElementById("artifactKind");
      const storyMetric = document.getElementById("storyMetric");
      const tokenMetric = document.getElementById("tokenMetric");
      const nodeMetric = document.getElementById("nodeMetric");
      const componentMetric = document.getElementById("componentMetric");
      const readStep = document.getElementById("readStep");
      const validateStep = document.getElementById("validateStep");
      const importStep = document.getElementById("importStep");

      let selectedPayload = null;
      let selectedFileName = "";
      let isImporting = false;

      function isRecord(value) {
        return typeof value === "object" && value !== null && !Array.isArray(value);
      }

      function formatFileSize(bytes) {
        if (!Number.isFinite(bytes)) return "";
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${Math.round(bytes / 1024)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
      }

      function countNodes(node) {
        if (!isRecord(node)) return 0;
        const children = Array.isArray(node.children) ? node.children : [];
        return 1 + children.reduce((total, child) => total + countNodes(child), 0);
      }

      function countComponents(payload) {
        const componentSystem = payload.componentSystem;
        if (!isRecord(componentSystem)) return 0;

        if (Array.isArray(componentSystem.components)) {
          return componentSystem.components.length;
        }

        if (isRecord(componentSystem.components)) {
          return Object.keys(componentSystem.components).length;
        }

        if (Array.isArray(componentSystem.instances)) {
          return componentSystem.instances.length;
        }

        return 0;
      }

      function getStoryLabel(payload) {
        return [payload.storyTitle, payload.storyName].filter(Boolean).join(" / ") || "Untitled";
      }

      function getCollectionCount(payload) {
        const collections = payload.tokenSystem && payload.tokenSystem.collections;
        if (!isRecord(collections)) return 0;
        return Object.values(collections).filter(Boolean).length;
      }

      function validatePayload(payload) {
        if (!isRecord(payload)) {
          throw new Error("The selected file is not a Storybook Figma export payload.");
        }

        if (payload.version !== 2) {
          throw new Error("Unsupported export payload version. Expected version 2.");
        }

        if (!isRecord(payload.root)) {
          throw new Error("The export payload is missing its root node.");
        }

        if (!Array.isArray(payload.tokens)) {
          throw new Error("The export payload is missing token data.");
        }
      }

      function setStatus(message, tone = "info") {
        status.textContent = message;
        status.dataset.tone = tone;
      }

      function setStepState(step, state) {
        if (state) {
          step.dataset.state = state;
        } else {
          delete step.dataset.state;
        }
      }

      function setDropState(state) {
        if (state) {
          dropZone.dataset.state = state;
        } else {
          delete dropZone.dataset.state;
        }
      }

      function syncActions() {
        clearButton.disabled = isImporting || (!selectedPayload && !selectedFileName);
        importButton.disabled = !selectedPayload || isImporting;
      }

      function resetSummary() {
        summaryPanel.hidden = true;
        artifactKind.textContent = "export";
        storyMetric.textContent = "-";
        tokenMetric.textContent = "-";
        nodeMetric.textContent = "-";
        componentMetric.textContent = "-";
      }

      function renderSummary(payload) {
        artifactKind.textContent = String(payload.artifactKind || "export");
        storyMetric.textContent = getStoryLabel(payload);
        tokenMetric.textContent = `${payload.tokens.length}`;
        nodeMetric.textContent = `${countNodes(payload.root)}`;
        componentMetric.textContent = `${countComponents(payload)}`;
        summaryPanel.hidden = false;
      }

      function resetForm() {
        selectedPayload = null;
        selectedFileName = "";
        isImporting = false;
        fileInput.value = "";
        fileTitle.textContent = "Select SBFX export";
        fileMeta.textContent = "No file selected";
        setDropState();
        resetSummary();
        setStepState(readStep);
        setStepState(validateStep);
        setStepState(importStep);
        setStatus("Waiting for export file.");
        syncActions();
      }

      async function loadFile(file) {
        selectedPayload = null;
        selectedFileName = file.name;
        isImporting = false;
        fileTitle.textContent = file.name;
        fileMeta.textContent = formatFileSize(file.size);
        setDropState("active");
        resetSummary();
        setStepState(readStep, "active");
        setStepState(validateStep);
        setStepState(importStep);
        setStatus("Reading export file...");
        syncActions();

        try {
          const payload = JSON.parse(await file.text());
          setStepState(readStep, "done");
          setStepState(validateStep, "active");
          validatePayload(payload);

          selectedPayload = payload;
          const collectionCount = getCollectionCount(payload);
          setDropState("ready");
          setStepState(validateStep, "done");
          renderSummary(payload);
          setStatus(
            `Ready: ${getStoryLabel(payload)}\n${payload.tokens.length} tokens, ${collectionCount} token collections.`,
            "success",
          );
        } catch (error) {
          const message = error instanceof Error ? error.message : "Unable to read file.";
          setDropState("error");
          setStepState(readStep, readStep.dataset.state === "done" ? "done" : "error");
          setStepState(validateStep, readStep.dataset.state === "done" ? "error" : undefined);
          setStatus(message, "error");
        }

        syncActions();
      }

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) {
          resetForm();
          return;
        }

        await loadFile(file);
      });

      dropZone.addEventListener("dragover", (event) => {
        event.preventDefault();
        if (!isImporting) setDropState("active");
      });

      dropZone.addEventListener("dragleave", () => {
        if (isImporting) return;
        setDropState(selectedPayload ? "ready" : selectedFileName ? "error" : undefined);
      });

      dropZone.addEventListener("drop", async (event) => {
        event.preventDefault();
        if (isImporting) return;

        const file = event.dataTransfer && event.dataTransfer.files && event.dataTransfer.files[0];
        if (!file) return;
        await loadFile(file);
      });

      clearButton.addEventListener("click", resetForm);

      importButton.addEventListener("click", () => {
        if (!selectedPayload || isImporting) return;

        isImporting = true;
        setStepState(importStep, "active");
        setStatus("Importing layers into Figma...");
        syncActions();
        parent.postMessage(
          {
            pluginMessage: {
              payload: selectedPayload,
              type: "import-payload",
            },
          },
          "*",
        );
      });

      window.onmessage = (event) => {
        const message = event.data && event.data.pluginMessage;
        if (!message) return;

        if (message.type === "import-progress") {
          isImporting = true;
          setStepState(importStep, "active");
          setStatus(message.message || "Importing layers into Figma...");
          syncActions();
          return;
        }

        if (message.type === "import-complete") {
          isImporting = false;
          setStepState(importStep, "done");
          setStatus(message.message || "Imported.", "success");
          syncActions();
          return;
        }

        if (message.type === "import-error") {
          isImporting = false;
          setStepState(importStep, "error");
          setStatus(message.message || "Import failed.", "error");
          syncActions();
        }
      };

      resetForm();
    </script>
  </body>
</html>
